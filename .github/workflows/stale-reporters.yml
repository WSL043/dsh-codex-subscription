name: Stale reporter follow-up

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v10
        with:
          only-issue-labels: waiting-for-reporter
          days-before-pr-stale: -1
          days-before-pr-close: -1
          days-before-issue-stale: 3
          days-before-issue-close: 0
          close-issue-reason: not_planned
          stale-issue-label: stale
          remove-stale-when-updated: true
          stale-issue-message: ''
          close-issue-message: >
            Closing after three days without the requested information. To continue, if you opened this issue, post a new comment starting with `/reopen` followed by the requested details to reopen it for review.
            等待所需信息三天后仍未收到回复，先关闭这条 issue。如需继续处理，报告者可在此处新发一条以 `/reopen` 开头的评论，并附上所需信息，即可重新打开。
