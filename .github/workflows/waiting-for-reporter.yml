name: Waiting for reporter follow-up

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: waiting-for-reporter
  cancel-in-progress: false

jobs:
  clear-on-reporter-reply:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'waiting-for-reporter')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'waiting-for-reporter',
            })

  follow-up:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const HOUR = 60 * 60 * 1000
            const WAITING = 'waiting-for-reporter'
            const REMINDER = '<!-- waiting-for-reporter-reminder -->'
            const owner = context.repo.owner
            const repo = context.repo.repo

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: WAITING,
              per_page: 100,
            })

            for (const issue of issues) {
              if (issue.pull_request) continue

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })
              const latestOwnerComment = comments
                .filter(comment => comment.user?.login === owner)
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0]
              if (!latestOwnerComment) continue

              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })
              const waitingEvent = events
                .filter(event => event.event === 'labeled' && event.label?.name === WAITING)
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0]
              if (!waitingEvent) continue

              const baseline = Math.max(
                Date.parse(latestOwnerComment.created_at),
                Date.parse(waitingEvent.created_at),
              )
              const reporterReplied = comments.some(comment =>
                comment.user?.type !== 'Bot' &&
                comment.user?.login === issue.user?.login &&
                Date.parse(comment.created_at) > baseline
              )
              if (reporterReplied) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: WAITING,
                })
                continue
              }

              const elapsed = Date.now() - baseline
              const reminder = comments.find(comment =>
                comment.body?.includes(REMINDER) && Date.parse(comment.created_at) >= baseline
              )

              if (reminder && Date.now() - Date.parse(reminder.created_at) >= 24 * HOUR) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: '暂时没有收到需要的信息，先关了。后面如果还能复现，把诊断和 macOS 版本贴上来再打开就行。',
                })
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                })
                continue
              }

              if (!reminder && elapsed >= 48 * HOUR) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `${REMINDER}\n还需要你补一下失败后的诊断和 macOS 版本。24 小时内没有新信息的话，这个 Issue 会先自动关闭；之后有结果随时可以再打开。`,
                })
              }
            }
