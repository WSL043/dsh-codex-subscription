name: Hotfix v1.0.3 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch installed command shim and bump v1.0.3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg['version'] == '1.0.3':
              raise SystemExit(0)
          if pkg['version'] != '1.0.2':
              raise SystemExit(f"unexpected package version {pkg['version']}")
          pkg['version'] = '1.0.3'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          manager = Path('dsh-codex.ps1')
          text = manager.read_text(encoding='utf-8-sig')
          text = text.replace("$PackageVersion = '1.0.2'", "$PackageVersion = '1.0.3'")
          text = text.replace('/releases/download/v1.0.2/dsh-codex-subscription.tgz', '/releases/download/v1.0.3/dsh-codex-subscription.tgz')
          constants = "$LegacyPackageName = '@wsl043/dsh-codex-subscription'\n$PackageVersion = '1.0.3'"
          replacement = "$LegacyPackageName = '@wsl043/dsh-codex-subscription'\n$ManagerScriptName = 'dsh-codex-manager.ps1'\n$LegacyManagerScriptName = 'dsh-codex.ps1'\n$ManagerShimName = 'dsh-codex.cmd'\n$PackageVersion = '1.0.3'"
          if text.count(constants) != 1:
              raise SystemExit('manager constants marker not found exactly once')
          text = text.replace(constants, replacement)

          old = """    $installedScript = Join-Path $Directory 'dsh-codex.ps1'\n    $installedShim = Join-Path $Directory 'dsh-codex.cmd'\n    if (-not (Test-Path -LiteralPath $installedScript -PathType Leaf) -or\n        -not (Test-Path -LiteralPath $installedShim -PathType Leaf)) {\n        throw 'Refusing to clean an unrecognized manager command directory.'\n    }\n"""
          new = """    $installedScript = Join-Path $Directory $ManagerScriptName\n    $legacyInstalledScript = Join-Path $Directory $LegacyManagerScriptName\n    $installedShim = Join-Path $Directory $ManagerShimName\n    $hasInstalledScript = (Test-Path -LiteralPath $installedScript -PathType Leaf) -or\n        (Test-Path -LiteralPath $legacyInstalledScript -PathType Leaf)\n    if (-not $hasInstalledScript -or -not (Test-Path -LiteralPath $installedShim -PathType Leaf)) {\n        throw 'Refusing to clean an unrecognized manager command directory.'\n    }\n"""
          if text.count(old) != 1: raise SystemExit('Start-ManagerCleanup marker mismatch')
          text = text.replace(old, new)

          old = """    Remove-Item -LiteralPath (Join-Path $directory 'dsh-codex.ps1') -Force -ErrorAction SilentlyContinue\n    Remove-Item -LiteralPath (Join-Path $directory 'dsh-codex.cmd') -Force -ErrorAction SilentlyContinue\n"""
          new = """    foreach ($name in @('dsh-codex-manager.ps1', 'dsh-codex.ps1', 'dsh-codex.cmd')) {\n        Remove-Item -LiteralPath (Join-Path $directory $name) -Force -ErrorAction SilentlyContinue\n    }\n"""
          if text.count(old) != 1: raise SystemExit('cleanup owned files marker mismatch')
          text = text.replace(old, new)

          old = """        $installedScript = Join-Path $Directory 'dsh-codex.ps1'\n        if ($Managed -and $PSCommandPath -and (Test-SamePath -Left $PSCommandPath -Right $installedScript)) {\n            Start-ManagerCleanup -Directory $Directory\n            return\n        }\n        foreach ($ownedFile in @('dsh-codex.ps1', 'dsh-codex.cmd')) {\n"""
          new = """        $installedScript = Join-Path $Directory $ManagerScriptName\n        $legacyInstalledScript = Join-Path $Directory $LegacyManagerScriptName\n        $isManagedScript = $Managed -and $PSCommandPath -and (\n            (Test-SamePath -Left $PSCommandPath -Right $installedScript) -or\n            (Test-SamePath -Left $PSCommandPath -Right $legacyInstalledScript)\n        )\n        if ($isManagedScript) {\n            Start-ManagerCleanup -Directory $Directory\n            return\n        }\n        foreach ($ownedFile in @($ManagerScriptName, $LegacyManagerScriptName, $ManagerShimName)) {\n"""
          if text.count(old) != 1: raise SystemExit('Remove-ManagerCommand marker mismatch')
          text = text.replace(old, new)

          old = """    $installedScript = Join-Path $Directory 'dsh-codex.ps1'\n    if (-not (Test-SamePath -Left $PSCommandPath -Right $installedScript)) {\n"""
          new = """    $installedScript = Join-Path $Directory $ManagerScriptName\n    if (-not (Test-SamePath -Left $PSCommandPath -Right $installedScript)) {\n"""
          if text.count(old) != 1: raise SystemExit('Install-ManagerCommand installed script marker mismatch')
          text = text.replace(old, new)

          old = """    $shim = @'\n@echo off\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File \"%~dp0dsh-codex.ps1\" -Managed %*\nexit /b %ERRORLEVEL%\n'@\n    [System.IO.File]::WriteAllText((Join-Path $Directory 'dsh-codex.cmd'), $shim, [System.Text.Encoding]::ASCII)\n"""
          new = """    $legacyInstalledScript = Join-Path $Directory $LegacyManagerScriptName\n    if (Test-Path -LiteralPath $legacyInstalledScript -PathType Leaf) {\n        Remove-Item -LiteralPath $legacyInstalledScript -Force\n    }\n\n    $shim = @'\n@echo off\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File \"%~dp0dsh-codex-manager.ps1\" -Managed %*\nexit /b %ERRORLEVEL%\n'@\n    [System.IO.File]::WriteAllText((Join-Path $Directory $ManagerShimName), $shim, [System.Text.Encoding]::ASCII)\n"""
          if text.count(old) != 1: raise SystemExit('shim marker mismatch')
          text = text.replace(old, new)
          manager.write_text(text, encoding='utf-8')

          for name in ['AGENTS.md', 'tests/release-contract.test.mjs', 'tests/powershell-manager.test.mjs']:
              p = Path(name)
              t = p.read_text(encoding='utf-8-sig')
              t = t.replace('1\\.0\\.2', '1\\.0\\.3').replace('1.0.2', '1.0.3')
              p.write_text(t, encoding='utf-8')

          tests = Path('tests/powershell-manager.test.mjs')
          t = tests.read_text()
          t = t.replace("assert.equal(existsSync(join(commandRoot, 'dsh-codex.ps1')), true)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), true)", "assert.equal(existsSync(join(commandRoot, 'dsh-codex-manager.ps1')), true)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.ps1')), false)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), true)")
          t = t.replace("assert.equal(existsSync(join(commandRoot, 'dsh-codex.ps1')), false)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), false)", "assert.equal(existsSync(join(commandRoot, 'dsh-codex-manager.ps1')), false)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.ps1')), false)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), false)")

          marker = "windowsTest('reusable command uninstalls the portable plugin and removes itself', () => {"
          if t.count(marker) != 1: raise SystemExit('test insertion marker mismatch')
          test_block = r'''windowsTest('bare dsh-codex uses the cmd shim under Restricted execution policy', () => {
  const sandbox = mkdtempSync(join(tmpdir(), 'dsh-codex-command-resolution-'))
  const root = join(sandbox, 'DSH Portable')
  const commandRoot = join(sandbox, 'command')
  try {
    functionalPortableFixture(root)
    mkdirSync(commandRoot, { recursive: true })
    writeFileSync(join(commandRoot, 'dsh-codex.ps1'), "throw 'legacy manager should have been removed'\n")
    const install = spawnSync('powershell.exe', [
      '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
      '-File', script.pathname.replace(/^\/(?:([A-Za-z]:))/, '$1'),
      '-Action', 'Install', '-PortableRoot', root,
      '-CommandRoot', commandRoot, '-NoModifyPath',
    ], { encoding: 'utf8' })
    assert.equal(install.status, 0, install.stderr || install.stdout)
    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), true)
    assert.equal(existsSync(join(commandRoot, 'dsh-codex-manager.ps1')), true)
    assert.equal(existsSync(join(commandRoot, 'dsh-codex.ps1')), false)

    const bare = spawnSync('powershell.exe', [
      '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Restricted',
      '-Command', 'dsh-codex',
    ], {
      encoding: 'utf8',
      env: { ...process.env, PATH: `${commandRoot};${process.env.PATH}` },
    })
    assert.equal(bare.status, 0, bare.stderr || bare.stdout)
    assert.match(bare.stdout, /dsh-codex <install\|update\|uninstall>/iu)
    assert.doesNotMatch(bare.stderr, /running scripts is disabled|PSSecurityException/iu)
  } finally {
    rmSync(sandbox, { recursive: true, force: true })
  }
})

'''
          t = t.replace(marker, test_block + marker)
          tests.write_text(t)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json AGENTS.md dsh-codex.ps1 tests/release-contract.test.mjs tests/powershell-manager.test.mjs
          git diff --cached --quiet && { echo 'No hotfix changes found.'; exit 0; }
          git commit -m 'fix: make dsh-codex callable under restricted PowerShell'
          git push origin HEAD:main
