name: DSH compatibility autopilot

on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: Exact official DSH version; empty selects the oldest untested version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-codex-compatibility-autopilot
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      dsh_version: ${{ steps.candidate.outputs.dsh_version }}
      plugin_version: ${{ steps.update.outputs.plugin_version }}
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Select and authenticate the next official DSH release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./compatibility.json').latestTested")"
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            candidate="$REQUESTED_VERSION"
          else
            pnpm view @deepseek-ai/dsh versions --json > "$RUNNER_TEMP/dsh-versions.json"
            mapfile -t candidates < <(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { compareVersions } from "./scripts/prepare-compat-release.mjs";
              const compatibility = JSON.parse(readFileSync(process.argv[2], "utf8"));
              const current = compatibility.latestTested;
              const tested = new Set([...(compatibility.supported ?? []), ...(compatibility.previews ?? [])]);
              const previewFloor = [...(compatibility.previews ?? [])].sort(compareVersions).at(-1) ?? current;
              const versions = [...new Set(JSON.parse(readFileSync(process.argv[1], "utf8")))]
                .filter(version => {
                  const preview = /-(?:alpha|beta)(?:\.|$)/u.test(version);
                  return typeof version === "string" && !tested.has(version)
                    && compareVersions(version, preview ? previewFloor : current) > 0;
                })
                .sort(compareVersions);
              process.stdout.write(versions.join("\n"));
            ' "$RUNNER_TEMP/dsh-versions.json" compatibility.json)
            candidate=''
            for version in "${candidates[@]}"; do
              if test "$(pnpm view "@deepseek-ai/dsh@$version" version 2>/dev/null || true)" = "$version" &&
                gh api "repos/deepseek-ai/deepseek-harness/releases/tags/dsh-v${version}" 2>/dev/null \
                  | jq -e '.draft == false and .immutable == true and (.published_at | type == "string")' >/dev/null; then
                candidate="$version"
                break
              fi
            done
          fi
          if [ -z "$candidate" ]; then
            echo "No untested DSH release is available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dsh_version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(pnpm view "@deepseek-ai/dsh@$candidate" version)" = "$candidate"
          gh api "repos/deepseek-ai/deepseek-harness/releases/tags/dsh-v${candidate}" \
            | jq -e '.draft == false and .immutable == true and (.published_at | type == "string")' >/dev/null
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "dsh_version=$candidate" >> "$GITHUB_OUTPUT"

      - name: Prepare the bounded compatibility patch
        if: steps.candidate.outputs.changed == 'true'
        id: update
        env:
          DSH_VERSION: ${{ steps.candidate.outputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-compat-release.mjs --dsh-version "$DSH_VERSION" > "$RUNNER_TEMP/update.json"
          echo "plugin_version=$(jq -r '.pluginVersion' "$RUNNER_TEMP/update.json")" >> "$GITHUB_OUTPUT"
          pnpm --config.minimum-release-age=0 install --lockfile-only
          node scripts/prepare-compat-release.mjs --refresh-release-age
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify source, build, and package
        if: steps.candidate.outputs.changed == 'true'
        run: |
          pnpm test
          pnpm run build
          git diff --check
          rm -rf .candidate
          mkdir .candidate
          pnpm pack --pack-destination .candidate
          package="$(find .candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          test -s "$package"

      - name: Fingerprint the accepted source patch
        if: steps.candidate.outputs.changed == 'true'
        id: patch
        shell: bash
        run: echo "sha256=$(git diff --binary | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  windows-acceptance:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Recreate candidate
        shell: powershell
        run: |
          node scripts/prepare-compat-release.mjs --dsh-version '${{ needs.prepare.outputs.dsh_version }}'
          pnpm --config.minimum-release-age=0 install --lockfile-only
          node scripts/prepare-compat-release.mjs --refresh-release-age
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          New-Item -ItemType Directory -Path .candidate | Out-Null
          pnpm pack --pack-destination .candidate
      - name: Verify Windows setup and manager behavior
        shell: powershell
        env:
          DSH_CODEX_TEST_USER_PATH: '1'
        run: node --test tests/powershell-manager.test.mjs
      - name: Accept install, update, Web startup, and uninstall in official DSH
        shell: powershell
        run: |
          $package = (Get-ChildItem -LiteralPath .candidate -Filter '*.tgz' -File | Select-Object -First 1).FullName
          if (-not $package) { throw 'Candidate package was not built.' }
          .\.github\scripts\accept-official-release.ps1 `
            -PackagePath $package `
            -DshVersion '${{ needs.prepare.outputs.dsh_version }}' `
            -DshRunner pnpm `
            -StartupTimeoutSeconds 90

  promote:
    needs: [prepare, windows-acceptance]
    if: needs.prepare.outputs.changed == 'true' && needs.windows-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reproduce the accepted candidate
        env:
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
          EXPECTED_PATCH: ${{ needs.prepare.outputs.patch_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-compat-release.mjs --dsh-version "$DSH_VERSION"
          pnpm --config.minimum-release-age=0 install --lockfile-only
          node scripts/prepare-compat-release.mjs --refresh-release-age
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          actual="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PATCH"
          test "$(node -p "require('./package.json').version")" = '${{ needs.prepare.outputs.plugin_version }}'
      - name: Refuse races and immutable release replacement
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.prepare.outputs.plugin_version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if gh release view "v$PLUGIN_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$PLUGIN_VERSION already exists; refusing replacement." >&2
            exit 1
          fi
      - name: Commit accepted compatibility update to main
        env:
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/scripts/accept-official-release.ps1 README.md README.en.md README.zh-CN.md compatibility.json dsh-codex.ps1 lib package.json pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "chore: support DSH $DSH_VERSION"
          git push origin HEAD:main
      - name: Dispatch and await the verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Release $request_id"
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f request_id="$request_id" \
            -f release_kind=compatibility \
            -f dsh_version="$DSH_VERSION"
          release_run=""
          for attempt in $(seq 1 90); do
            sleep 2
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle)"
            release_run="$(jq -r --arg title "$title" 'map(select(.displayTitle == $title))[0].databaseId // empty' <<< "$runs")"
            if [ -n "$release_run" ]; then
              break
            fi
          done
          test -n "$release_run"
          gh run watch "$release_run" --repo "$GITHUB_REPOSITORY" --exit-status
