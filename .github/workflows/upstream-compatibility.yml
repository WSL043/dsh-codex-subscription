name: DSH compatibility autopilot

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [dsh-upstream-release]
  workflow_dispatch:
    inputs:
      dsh_version:
        description: Exact official DSH version; empty selects the newest untested version
        required: false
        type: string
      dry_run:
        description: Exercise candidate and publisher verification without committing or publishing
        required: false
        type: boolean
        default: false
      publish_compatibility:
        description: Publish a verified stable-channel compatibility patch
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dsh-codex-compatibility-autopilot
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      blocked: ${{ steps.detect.outputs.blocked }}
      reason: ${{ steps.detect.outputs.reason }}
      stable: ${{ steps.detect.outputs.stable }}
      dsh_version: ${{ steps.detect.outputs.dsh_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Inspect official npm channels and the published plugin
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_VERSION: ${{ inputs.dsh_version || github.event.client_payload.dsh_version }}
        run: node scripts/upstream-compatibility.mjs detect

  prepare:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ needs.detect.outputs.changed }}
      dsh_version: ${{ needs.detect.outputs.dsh_version }}
      plugin_version: ${{ steps.update.outputs.plugin_version }}
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare the bounded compatibility patch
        if: needs.detect.outputs.changed == 'true'
        id: update
        env:
          DSH_VERSION: ${{ needs.detect.outputs.dsh_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          extra=(); [[ "$DRY_RUN" != true ]] || extra+=(--recheck)
          node scripts/prepare-compat-release.mjs --dsh-version "$DSH_VERSION" "${extra[@]}" > "$RUNNER_TEMP/update.json"
          echo "plugin_version=$(jq -r '.pluginVersion' "$RUNNER_TEMP/update.json")" >> "$GITHUB_OUTPUT"
          pnpm --config.minimum-release-age=0 install --lockfile-only
          node scripts/prepare-compat-release.mjs --refresh-release-age
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify source, build, and package
        if: needs.detect.outputs.changed == 'true'
        run: |
          pnpm test
          pnpm run build
          git diff --check
          rm -rf .candidate
          mkdir .candidate
          pnpm pack --pack-destination .candidate
          package="$(find .candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          test -s "$package"

      - name: Fingerprint the accepted source patch
        if: needs.detect.outputs.changed == 'true'
        id: patch
        shell: bash
        run: echo "sha256=$(git diff --binary | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  windows-acceptance:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Recreate candidate
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: powershell
        run: |
          $extra = if ($env:DRY_RUN -eq 'true') { @('--recheck') } else { @() }
          node scripts/prepare-compat-release.mjs --dsh-version '${{ needs.prepare.outputs.dsh_version }}' @extra
          pnpm --config.minimum-release-age=0 install --lockfile-only
          node scripts/prepare-compat-release.mjs --refresh-release-age
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          New-Item -ItemType Directory -Path .candidate | Out-Null
          pnpm pack --pack-destination .candidate
      - name: Verify Windows setup and manager behavior
        shell: powershell
        env:
          DSH_CODEX_TEST_USER_PATH: '1'
        run: node --test tests/powershell-manager.test.mjs
      - name: Accept install, update, Web startup, and uninstall in official DSH
        shell: powershell
        run: |
          $package = (Get-ChildItem -LiteralPath .candidate -Filter '*.tgz' -File | Select-Object -First 1).FullName
          if (-not $package) { throw 'Candidate package was not built.' }
          .\.github\scripts\accept-official-release.ps1 `
            -PackagePath $package `
            -DshVersion '${{ needs.prepare.outputs.dsh_version }}' `
            -DshRunner pnpm `
            -StartupTimeoutSeconds 90

  promote:
    needs: [detect, prepare, windows-acceptance]
    if: needs.prepare.outputs.changed == 'true' && needs.windows-acceptance.result == 'success' && (inputs.dry_run == true || (needs.detect.outputs.stable == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publish_compatibility == true) || (github.event_name != 'workflow_dispatch' && vars.DSH_COMPAT_AUTO_PUBLISH == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reproduce the accepted candidate
        env:
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
          EXPECTED_PATCH: ${{ needs.prepare.outputs.patch_sha256 }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          extra=(); [[ "$DRY_RUN" != true ]] || extra+=(--recheck)
          node scripts/prepare-compat-release.mjs --dsh-version "$DSH_VERSION" "${extra[@]}"
          pnpm --config.minimum-release-age=0 install --lockfile-only
          node scripts/prepare-compat-release.mjs --refresh-release-age
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          actual="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PATCH"
          test "$(node -p "require('./package.json').version")" = '${{ needs.prepare.outputs.plugin_version }}'
      - name: Refuse races and immutable release replacement
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.prepare.outputs.plugin_version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if gh release view "v$PLUGIN_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$PLUGIN_VERSION already exists; refusing replacement." >&2
            exit 1
          fi
      - name: Commit accepted compatibility update to main
        if: inputs.dry_run != true
        env:
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/scripts/accept-official-release.ps1 src/subagent-runtime.js README.md README.en.md compatibility.json dsh-codex.ps1 lib package.json pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "chore: support DSH $DSH_VERSION"
          git push origin HEAD:main
      - name: Dispatch and await the verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Release $request_id"
          if [[ "$DRY_RUN" == 'true' ]]; then
            echo 'DRY RUN: no main push, tag, Release or npm publication.'
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f request_id="$request_id" -f verify_only=true
          else
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f request_id="$request_id" -f release_kind=compatibility -f dsh_version="$DSH_VERSION"
          fi
          release_run=""
          for attempt in $(seq 1 90); do
            sleep 2
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle)"
            release_run="$(jq -r --arg title "$title" 'map(select(.displayTitle == $title))[0].databaseId // empty' <<< "$runs")"
            if [ -n "$release_run" ]; then
              break
            fi
          done
          test -n "$release_run"
          gh run watch "$release_run" --repo "$GITHUB_REPOSITORY" --exit-status

  report:
    needs: [detect, prepare, windows-acceptance, promote]
    if: always() && inputs.dry_run != true && needs.detect.outputs.dsh_version != '' && (needs.detect.outputs.blocked == 'true' || needs.prepare.result == 'failure' || needs.windows-acceptance.result == 'failure' || needs.promote.result == 'failure' || (needs.detect.outputs.stable == 'false' && needs.windows-acceptance.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Leave one actionable record instead of rebuilding a blocked version
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ needs.detect.outputs.dsh_version }}
          BLOCK_REASON: ${{ needs.detect.outputs.reason || (needs.detect.outputs.stable == 'false' && 'Alpha-channel verification needs separate review; it is not promoted to the stable plugin channel') || '' }}
        run: node scripts/upstream-compatibility.mjs report
