name: DSH compatibility autopilot

on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [Stale reporter follow-up, Risk-based CI]
    types: [completed]
  repository_dispatch:
    types: [dsh-upstream-release]
  workflow_dispatch:
    inputs:
      dsh_version:
        description: Exact official DSH version; empty selects the newest untested version
        required: false
        type: string
      dry_run:
        description: Exercise candidate and publisher verification without pushing refs or publishing
        required: false
        type: boolean
        default: false
      publish_compatibility:
        description: Publish a verified stable-channel compatibility patch
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dsh-codex-compatibility-autopilot
  cancel-in-progress: false

jobs:
  close-resolved:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Risk-based CI' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Close bot reports covered by validated main
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$current" == "$VALIDATED_SHA" ]]; then
            node scripts/upstream-compatibility.mjs close-resolved
          fi

  detect:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      blocked: ${{ steps.detect.outputs.blocked }}
      reason: ${{ steps.detect.outputs.reason }}
      stable: ${{ steps.detect.outputs.stable }}
      dsh_version: ${{ steps.detect.outputs.dsh_version }}
      baseline_sha: ${{ steps.detect.outputs.baseline_sha }}
      published_version: ${{ steps.detect.outputs.published_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Inspect official npm channels and the published plugin
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_VERSION: ${{ inputs.dsh_version || github.event.client_payload.dsh_version }}
        run: node scripts/upstream-compatibility.mjs detect
      - name: Record the natural trigger and detection result
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          BLOCKED: ${{ steps.detect.outputs.blocked }}
        run: |
          printf 'Event: %s\nSchedule: %s\nChanged: %s\nBlocked: %s\n' "$EVENT_NAME" "$SCHEDULE" "$CHANGED" "$BLOCKED" >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ needs.detect.outputs.changed }}
      dsh_version: ${{ needs.detect.outputs.dsh_version }}
      plugin_version: ${{ steps.candidate.outputs.plugin_version }}
      patch_sha256: ${{ steps.candidate.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: ./.github/actions/compatibility-candidate
        id: candidate
        with:
          baseline_sha: ${{ needs.detect.outputs.baseline_sha }}
          recheck: ${{ inputs.dry_run == true }}
          dsh_version: ${{ needs.detect.outputs.dsh_version }}

  windows-acceptance:
    needs: [detect, prepare]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: ./.github/actions/compatibility-candidate
        with:
          baseline_sha: ${{ needs.detect.outputs.baseline_sha }}
          recheck: ${{ inputs.dry_run == true }}
          dsh_version: ${{ needs.prepare.outputs.dsh_version }}
          run_tests: 'false'
      - name: Verify Windows setup and manager behavior
        shell: powershell
        working-directory: .compat-candidate
        env:
          DSH_CODEX_TEST_USER_PATH: '1'
        run: node --test tests/powershell-manager.test.mjs
      - name: Accept install, update, Web startup, and uninstall in official DSH
        shell: powershell
        run: |
          $package = (Get-ChildItem -LiteralPath .compat-candidate/.candidate -Filter '*.tgz' -File | Select-Object -First 1).FullName
          if (-not $package) { throw 'Candidate package was not built.' }
          .\.github\scripts\accept-official-release.ps1 `
            -PackagePath $package `
            -DshVersion '${{ needs.prepare.outputs.dsh_version }}' `
            -DshRunner pnpm `
            -StartupTimeoutSeconds 90

  promote:
    needs: [detect, prepare, windows-acceptance]
    if: needs.prepare.outputs.changed == 'true' && needs.windows-acceptance.result == 'success' && (inputs.dry_run == true || (needs.detect.outputs.stable == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publish_compatibility == true) || (github.event_name != 'workflow_dispatch' && vars.DSH_COMPAT_AUTO_PUBLISH == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: ./.github/actions/compatibility-candidate
        id: candidate
        with:
          baseline_sha: ${{ needs.detect.outputs.baseline_sha }}
          recheck: ${{ inputs.dry_run == true }}
          dsh_version: ${{ needs.prepare.outputs.dsh_version }}
      - name: Compare the accepted candidate
        env:
          EXPECTED_PATCH: ${{ needs.prepare.outputs.patch_sha256 }}
          ACTUAL_PATCH: ${{ steps.candidate.outputs.patch_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_PATCH" = "$EXPECTED_PATCH"
      - name: Refuse races and immutable release replacement
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.prepare.outputs.plugin_version }}
          BASELINE_VERSION: ${{ needs.detect.outputs.published_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view dsh-codex-subscription dist-tags.latest)" = "$BASELINE_VERSION"
          if gh release view "v$PLUGIN_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$PLUGIN_VERSION already exists; refusing replacement." >&2
            exit 1
          fi
      - name: Commit and validate the local compatibility source
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
          BASELINE_VERSION: ${{ needs.detect.outputs.published_version }}
        shell: bash
        working-directory: .compat-candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/scripts/accept-official-release.ps1 src/subagent-runtime.js 'README*.md' compatibility.json dsh-codex.ps1 lib package.json pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "chore: support DSH $DSH_VERSION"
          export SOURCE_SHA="$(git rev-parse HEAD)"
          node ../scripts/verify-compatibility-source.mjs
      - name: Push the isolated release ref
        if: inputs.dry_run != true
        shell: bash
        working-directory: .compat-candidate
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:refs/heads/compatibility-release
      - name: Dispatch and await the verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          BASELINE_VERSION: ${{ needs.detect.outputs.published_version }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Release $request_id"
          if [[ "$DRY_RUN" == 'true' ]]; then
            echo 'DRY RUN: published-tag candidate and Windows acceptance passed; no ref, tag, Release or npm publication.'
            exit 0
          else
            source_sha="$(git -C .compat-candidate rev-parse HEAD)"
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f request_id="$request_id" -f release_kind=compatibility -f dsh_version="$DSH_VERSION" -f source_ref="$source_sha" -f baseline_version="$BASELINE_VERSION"
          fi
          release_run=""
          for attempt in $(seq 1 90); do
            sleep 2
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle)"
            release_run="$(jq -r --arg title "$title" 'map(select(.displayTitle == $title))[0].databaseId // empty' <<< "$runs")"
            if [ -n "$release_run" ]; then
              break
            fi
          done
          test -n "$release_run"
          gh run watch "$release_run" --repo "$GITHUB_REPOSITORY" --exit-status

  report:
    needs: [detect, prepare, windows-acceptance, promote]
    if: always() && inputs.dry_run != true && needs.detect.outputs.dsh_version != '' && (needs.detect.outputs.blocked == 'true' || needs.prepare.result == 'failure' || needs.windows-acceptance.result == 'failure' || needs.promote.result == 'failure' || (needs.detect.outputs.stable == 'false' && needs.windows-acceptance.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Leave one actionable record instead of rebuilding a blocked version
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ needs.detect.outputs.dsh_version }}
          BLOCK_REASON: ${{ needs.detect.outputs.reason || (needs.detect.outputs.stable == 'false' && 'Alpha-channel verification needs separate review; it is not promoted to the stable plugin channel') || '' }}
        run: node scripts/upstream-compatibility.mjs report
