name: Native Linux voice acceptance

on:
  push:
    paths:
      - 'src/voice-*.js'
      - 'src/remote-control-realtime.js'
      - 'src/remote-control-dsh.js'
      - 'src/subscription-rpc.js'
      - 'src/client-voice-call.jsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/verify-native-voice.*'
      - '.github/workflows/native-voice.yml'
  pull_request:
    paths:
      - 'src/voice-*.js'
      - 'src/remote-control-realtime.js'
      - 'src/remote-control-dsh.js'
      - 'src/subscription-rpc.js'
      - 'src/client-voice-call.jsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/verify-native-voice.*'
      - '.github/workflows/native-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkitgtk:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install native GTK test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-webkit2-4.1 xvfb xauth xdotool pulseaudio gstreamer1.0-plugins-good
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/voice-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=voice_test rate=48000
          pactl set-default-sink voice_test
      - name: Verify actual WebKitGTK capture, duplex PCM, mute and cleanup
        run: node scripts/verify-native-voice.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-voice-${{ github.sha }}
          path: .artifacts/native-voice/
          include-hidden-files: true
          if-no-files-found: warn
