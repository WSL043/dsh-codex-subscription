name: Prepare v1.0.4 once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prepare-v1-0-4
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remember the selected DSH target and bump v1.0.4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg['version'] not in ('1.0.3', '1.0.4'):
              raise SystemExit(f"unexpected package version {pkg['version']}")
          pkg['version'] = '1.0.4'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          manager_path = Path('dsh-codex.ps1')
          manager = manager_path.read_text(encoding='utf-8-sig')
          manager = manager.replace('1.0.3', '1.0.4')

          if "$ManagerStateName = 'dsh-codex-state.json'" not in manager:
              manager = replace_once(
                  manager,
                  "$ManagerShimName = 'dsh-codex.cmd'\n$PackageVersion = '1.0.4'",
                  "$ManagerShimName = 'dsh-codex.cmd'\n$ManagerStateName = 'dsh-codex-state.json'\n$PackageVersion = '1.0.4'",
                  'manager state constant',
              )

          if '$ProfileWasExplicit' not in manager:
              manager = replace_once(
                  manager,
                  "$OutputEncoding = $Utf8NoBom\n\nif ($Managed -and -not $PSBoundParameters.ContainsKey('Action')) {",
                  "$OutputEncoding = $Utf8NoBom\n\n$ProfileWasExplicit = $PSBoundParameters.ContainsKey('Profile')\n$PortableRootWasExplicit = $PSBoundParameters.ContainsKey('PortableRoot')\n$ManagerTargetMode = $null\n\nif ($Managed -and -not $PSBoundParameters.ContainsKey('Action')) {",
                  'explicit parameter markers',
              )

          state_functions = r'''function Get-ManagerStatePath {
    param([Parameter(Mandatory = $true)][string] $Directory)
    return Join-Path $Directory $ManagerStateName
}

function Read-ManagerState {
    param([Parameter(Mandatory = $true)][string] $Directory)

    $statePath = Get-ManagerStatePath -Directory $Directory
    if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { return $null }
    try {
        $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
    } catch {
        throw 'The saved dsh-codex target is unreadable. Re-run setup or pass -PortableRoot explicitly.'
    }

    $schema = $state.PSObject.Properties['schemaVersion']
    $modeProperty = $state.PSObject.Properties['mode']
    $profileProperty = $state.PSObject.Properties['profile']
    if ($null -eq $schema -or [string] $schema.Value -ne '1' -or
        $null -eq $modeProperty -or $null -eq $profileProperty) {
        throw 'The saved dsh-codex target has an unsupported format. Re-run setup or pass -PortableRoot explicitly.'
    }

    $mode = [string] $modeProperty.Value
    $savedProfile = [string] $profileProperty.Value
    if ($mode -notin @('portable', 'global') -or $savedProfile -notmatch '^[A-Za-z0-9._-]+$') {
        throw 'The saved dsh-codex target is invalid. Re-run setup or pass -PortableRoot explicitly.'
    }

    $savedPortableRoot = $null
    if ($mode -eq 'portable') {
        $rootProperty = $state.PSObject.Properties['portableRoot']
        if ($null -eq $rootProperty -or -not [string] $rootProperty.Value) {
            throw 'The saved DSH-Portable target is missing its folder. Re-run setup or pass -PortableRoot explicitly.'
        }
        $savedPortableRoot = Resolve-FullPath ([string] $rootProperty.Value)
    }

    return [pscustomobject]@{
        SchemaVersion = 1
        Mode = $mode
        Profile = $savedProfile
        PortableRoot = $savedPortableRoot
    }
}

function Write-ManagerState {
    param(
        [Parameter(Mandatory = $true)][string] $Directory,
        [Parameter(Mandatory = $true)] $Target
    )

    $portableRoot = if ($Target.Mode -eq 'portable') { $Target.Layout.Root } else { $null }
    $payload = [ordered]@{
        schemaVersion = 1
        mode = [string] $Target.Mode
        profile = [string] $Profile
        portableRoot = $portableRoot
    } | ConvertTo-Json -Compress

    $statePath = Get-ManagerStatePath -Directory $Directory
    $stagedState = Join-Path $Directory ('.dsh-codex-state-' + [guid]::NewGuid().ToString('N') + '.json')
    try {
        [System.IO.File]::WriteAllText($stagedState, $payload, $Utf8NoBom)
        Move-Item -LiteralPath $stagedState -Destination $statePath -Force
    } finally {
        if (Test-Path -LiteralPath $stagedState) {
            Remove-Item -LiteralPath $stagedState -Force -ErrorAction SilentlyContinue
        }
    }
}

'''
          if 'function Get-ManagerStatePath {' not in manager:
              marker = 'function Invoke-LatestManager {'
              if manager.count(marker) != 1:
                  raise SystemExit('manager state insertion marker mismatch')
              manager = manager.replace(marker, state_functions + marker)

          global_target = r'''function New-GlobalTarget {
    param([switch] $Remembered)

    $globalDsh = Get-Command dsh -ErrorAction SilentlyContinue
    if ($null -eq $globalDsh) {
        if ($Remembered) {
            throw 'The remembered global DSH target is no longer available on PATH. Re-run setup to choose a target.'
        }
        throw 'The dsh command is not available on PATH.'
    }
    $globalNode = Get-Command node -ErrorAction SilentlyContinue
    if ($null -eq $globalNode) {
        if ($Remembered) {
            throw 'The remembered global DSH target no longer has Node.js on PATH. Re-run setup to choose a target.'
        }
        throw 'The dsh command exists, but Node.js is not available on PATH.'
    }
    return [pscustomobject]@{
        Mode = 'global'
        Layout = $null
        Executable = $globalDsh.Source
        Node = $globalNode.Source
        UsesPortableCli = $false
    }
}

'''
          if 'function New-GlobalTarget {' not in manager:
              marker = 'function Find-PortableFromCurrentDirectory {'
              if manager.count(marker) != 1:
                  raise SystemExit('global target insertion marker mismatch')
              manager = manager.replace(marker, global_target + marker)

          if "if ($ManagerTargetMode -eq 'global')" not in manager:
              manager = replace_once(
                  manager,
                  "    $layout = Find-PortableFromCurrentDirectory\n",
                  "    if ($ManagerTargetMode -eq 'global') {\n        return New-GlobalTarget -Remembered\n    }\n\n    $layout = Find-PortableFromCurrentDirectory\n",
                  'remembered global target branch',
              )

          old_global = """    if ($null -ne $globalDsh) {\n        $globalNode = Get-Command node -ErrorAction SilentlyContinue\n        if ($null -eq $globalNode) { throw 'The dsh command exists, but Node.js is not available on PATH.' }\n        return [pscustomobject]@{ Mode = 'global'; Layout = $null; Executable = $globalDsh.Source; Node = $globalNode.Source; UsesPortableCli = $false }\n    }\n"""
          if old_global in manager:
              manager = manager.replace(old_global, "    if ($null -ne $globalDsh) { return New-GlobalTarget }\n")

          state_load = r'''$managerCommandRoot = Get-ManagerCommandRoot
if ($Managed) {
    $managerState = Read-ManagerState -Directory $managerCommandRoot
    if ($null -ne $managerState) {
        if (-not $ProfileWasExplicit) { $Profile = $managerState.Profile }
        if (-not $PortableRootWasExplicit) {
            $ManagerTargetMode = $managerState.Mode
            if ($managerState.Mode -eq 'portable') { $PortableRoot = $managerState.PortableRoot }
        }
    }
}
'''
          old = '$managerCommandRoot = Get-ManagerCommandRoot\n'
          if state_load not in manager:
              if manager.count(old) != 1:
                  raise SystemExit('manager state load marker mismatch')
              manager = manager.replace(old, state_load, 1)

          manager = manager.replace(
              "foreach ($name in @('dsh-codex-manager.ps1', 'dsh-codex.ps1', 'dsh-codex.cmd')) {",
              "foreach ($name in @('dsh-codex-manager.ps1', 'dsh-codex.ps1', 'dsh-codex.cmd', 'dsh-codex-state.json')) {",
          )
          manager = manager.replace(
              'foreach ($ownedFile in @($ManagerScriptName, $LegacyManagerScriptName, $ManagerShimName)) {',
              'foreach ($ownedFile in @($ManagerScriptName, $LegacyManagerScriptName, $ManagerShimName, $ManagerStateName)) {',
          )

          if 'Write-ManagerState -Directory $managerCommandRoot -Target $target' not in manager:
              manager = replace_once(
                  manager,
                  '        Install-ManagerCommand -Directory $managerCommandRoot\n        $verb = if ($Action -eq \'Update\') { \'Updated.\' } else { \'Installed.\' }',
                  '        Install-ManagerCommand -Directory $managerCommandRoot\n        Write-ManagerState -Directory $managerCommandRoot -Target $target\n        $verb = if ($Action -eq \'Update\') { \'Updated.\' } else { \'Installed.\' }',
                  'manager state write',
              )

          manager_path.write_text(manager, encoding='utf-8')

          for name in ['AGENTS.md', 'tests/release-contract.test.mjs', 'tests/powershell-manager.test.mjs']:
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              text = text.replace('1\\.0\\.3', '1\\.0\\.4').replace('1.0.3', '1.0.4')
              path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/powershell-manager.test.mjs')
          tests = tests_path.read_text()

          install_assertions = """    assert.equal(existsSync(join(commandRoot, 'dsh-codex-manager.ps1')), true)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.ps1')), false)\n    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), true)\n"""
          if "dsh-codex-state.json')), true" not in tests:
              replacement = install_assertions + """    assert.equal(existsSync(join(commandRoot, 'dsh-codex-state.json')), true)\n    const savedTarget = JSON.parse(readFileSync(join(commandRoot, 'dsh-codex-state.json'), 'utf8'))\n    assert.deepEqual(savedTarget, {\n      schemaVersion: 1,\n      mode: 'portable',\n      profile: 'web',\n      portableRoot: realpathSync.native(root),\n    })\n"""
              if tests.count(install_assertions) < 1:
                  raise SystemExit('state write test marker missing')
              tests = tests.replace(install_assertions, replacement, 1)

          state_setup_marker = """  try {\n    functionalPortableFixture(root)\n    server.listen(0, '127.0.0.1')\n"""
          state_setup_replacement = """  try {\n    functionalPortableFixture(root)\n    mkdirSync(commandRoot, { recursive: true })\n    writeFileSync(join(commandRoot, 'dsh-codex-state.json'), JSON.stringify({\n      schemaVersion: 1,\n      mode: 'portable',\n      profile: 'web',\n      portableRoot: realpathSync.native(root),\n    }))\n    server.listen(0, '127.0.0.1')\n"""
          if state_setup_replacement not in tests:
              if tests.count(state_setup_marker) != 1:
                  raise SystemExit('managed update state fixture marker mismatch')
              tests = tests.replace(state_setup_marker, state_setup_replacement)

          old_args = """        '-File', script.pathname.replace(/^\\/(?:([A-Za-z]:))/, '$1'),\n        '-Managed', '-Action', 'Update', '-Profile', 'web',\n        '-PortableRoot', root, '-CommandRoot', commandRoot, '-NoModifyPath',\n"""
          new_args = """        '-File', script.pathname.replace(/^\\/(?:([A-Za-z]:))/, '$1'),\n        '-Managed', '-Action', 'Update',\n        '-CommandRoot', commandRoot, '-NoModifyPath',\n"""
          if old_args in tests:
              tests = tests.replace(old_args, new_args, 1)

          uninstall_assertion = """    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), false)\n"""
          if "assert.equal(existsSync(join(commandRoot, 'dsh-codex-state.json')), false)" not in tests:
              pos = tests.find("windowsTest('direct uninstall removes only manager-owned files from a custom command directory'")
              if pos < 0:
                  raise SystemExit('uninstall state test marker mismatch')
              tail = tests[pos:]
              idx = tail.find(uninstall_assertion)
              if idx < 0:
                  raise SystemExit('uninstall cmd assertion marker missing')
              absolute = pos + idx
              tests = tests[:absolute] + uninstall_assertion + "    assert.equal(existsSync(join(commandRoot, 'dsh-codex-state.json')), false)\n" + tests[absolute + len(uninstall_assertion):]

          tests_path.write_text(tests)
          PY

          node --test tests/release-contract.test.mjs tests/release-notes.test.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.0.4-once.yml
          git rm -f .github/prepare-v1.0.4-trigger.txt 2>/dev/null || true
          git add package.json AGENTS.md dsh-codex.ps1 tests/release-contract.test.mjs tests/powershell-manager.test.mjs
          git commit -m 'fix: remember the selected DSH target for managed commands'
          git push origin HEAD:main
