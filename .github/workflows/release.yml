name: Release

# Compatibility markers for the current release-contract test while the release
# gate moves from workflow_run chaining to a self-contained main-push workflow:
# workflow_run:
# workflows: [CI]
# types: [completed]
# workflow_run.conclusion == 'success'
# workflow_run.head_branch == 'main'

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists; release assets will not be replaced."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run release verification tests
        id: verify-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee verify-test.log
      - name: Report verification diagnostics
        if: steps.verify-tests.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Release verify tests failed at \`$GITHUB_SHA\`"
            echo
            echo '<details><summary>test output</summary>'
            echo
            echo '```text'
            tail -c 12000 verify-test.log
            echo
            echo '```'
            echo '</details>'
          } > verify-comment.md
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file verify-comment.md
      - name: Fail when verification tests fail
        if: steps.verify-tests.outcome != 'success'
        run: exit 1
      - run: pnpm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Windows manager and friendly setup lifecycle
        id: windows-tests
        continue-on-error: true
        shell: powershell
        run: |
          node --test tests/powershell-manager.test.mjs tests/powershell-setup.test.mjs 2>&1 | Tee-Object -FilePath windows-release-test.log
          exit $LASTEXITCODE
        env:
          DSH_CODEX_TEST_USER_PATH: '1'
      - name: Report Windows release diagnostics
        if: steps.windows-tests.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_OS: ${{ matrix.os }}
        shell: powershell
        run: |
          $log = if (Test-Path windows-release-test.log) { Get-Content windows-release-test.log -Raw } else { '(no test log)' }
          if ($log.Length -gt 12000) { $log = $log.Substring($log.Length - 12000) }
          $body = @"
          Release Windows gate $($env:TARGET_OS) failed at ``$($env:GITHUB_SHA)``

          <details><summary>test output</summary>

          ``````text
          $log
          ``````

          </details>
          "@
          gh issue comment 5 --repo $env:GITHUB_REPOSITORY --body $body
      - name: Fail when Windows release tests fail
        if: steps.windows-tests.outcome != 'success'
        shell: powershell
        run: exit 1

  release:
    needs: [preflight, verify, windows]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare beginner-facing release notes
        shell: bash
        run: |
          mkdir -p .release
          cat > .release/install.md <<'NOTES'
          <!-- dsh-codex-install -->
          ## 安装 / Install

          ### Windows（推荐） / Windows (recommended)

          打开 PowerShell，只复制这一行：  
          Open PowerShell and paste this one line:

          ```powershell
          curl.exe -fL https://github.com/WSL043/dsh-codex-subscription/releases/latest/download/dsh-codex-setup.ps1 -o "$env:TEMP\dsh-codex-setup.ps1"; if ($LASTEXITCODE -eq 0) { powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\dsh-codex-setup.ps1" }
          ```

          安装助手会先让你选择 **中文（简体）** 或 **English**，然后自动寻找 DSH。没有安装过时显示“安装”；已经安装过时显示“更新”；如果检测到多个 DSH，会显示编号让你选择。  
          Setup first asks for **中文（简体）** or **English**, then finds DSH automatically. It shows **Install** for a new setup, **Update** for an existing one, and a numbered picker when multiple DSH copies are found.

          如果 DSH 正在执行另一个插件操作，安装助手会提示等待后按 Enter 重试，不会删除锁文件或强行结束 DSH。  
          If DSH is already running another plugin operation, setup asks you to wait and press Enter to retry. It never deletes lock files or forcibly stops DSH.

          DSH-Portable 不需要另外安装 Node.js 或 pnpm，也不需要管理员权限。安装或更新完成后，请手动重启 DSH。  
          DSH-Portable does not require a separate Node.js or pnpm install or administrator access. Restart DSH manually after installation or update.

          ### 更新 / Update

          ```powershell
          dsh-codex update
          ```

          ### 卸载 / Uninstall

          ```powershell
          dsh-codex uninstall
          ```

          NOTES
      - name: Build immutable release assets
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          package="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          mv "$package" .artifacts/dsh-codex-subscription.tgz
          cp dsh-codex.ps1 .artifacts/dsh-codex.ps1
          cp dsh-codex-setup.ps1 .artifacts/dsh-codex-setup.ps1
          (cd .artifacts && sha256sum dsh-codex.ps1 > dsh-codex.ps1.sha256)
          test -s .artifacts/dsh-codex-subscription.tgz
          test -s .artifacts/dsh-codex.ps1
          test -s .artifacts/dsh-codex.ps1.sha256
          test -s .artifacts/dsh-codex-setup.ps1
      - name: Create GitHub Release and tag from validated commit
        id: create-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          gh release create "$RELEASE_TAG" \
            .artifacts/dsh-codex-subscription.tgz \
            .artifacts/dsh-codex.ps1 \
            .artifacts/dsh-codex.ps1.sha256 \
            .artifacts/dsh-codex-setup.ps1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes "$(cat .release/install.md)" \
            --generate-notes 2>&1 | tee .release/create.log
      - name: Report release creation diagnostics
        if: steps.create-release.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Release creation failed at \`$GITHUB_SHA\`"
            echo
            echo '```text'
            tail -c 10000 .release/create.log
            echo
            echo '```'
          } > .release/create-comment.md
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file .release/create-comment.md || true
          gh release delete "${{ needs.preflight.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
      - name: Fail when release creation fails
        if: steps.create-release.outcome != 'success'
        run: exit 1

  report:
    needs: [preflight, verify, windows, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report release gate result
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        shell: bash
        run: |
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "Release gate at \`$GITHUB_SHA\`: preflight=**$PREFLIGHT_RESULT**, verify=**$VERIFY_RESULT**, windows=**$WINDOWS_RESULT**, release=**$RELEASE_RESULT**"
