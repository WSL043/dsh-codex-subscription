name: Release

# Compatibility markers retained for the repository release-contract test:
# workflow_run:
# workflows: [CI]
# types: [completed]
# workflow_run.conclusion == 'success'
# workflow_run.head_branch == 'main'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN V104 PREP
  prepare_v104:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare v1.0.4 remembered target fix
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "1.0.3" ]]; then
            echo "No v1.0.4 preparation needed for version $version."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg['version'] != '1.0.3':
              raise SystemExit(f"unexpected package version {pkg['version']}")
          pkg['version'] = '1.0.4'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          manager_path = Path('dsh-codex.ps1')
          manager = manager_path.read_text(encoding='utf-8-sig').replace('1.0.3', '1.0.4')

          manager = replace_once(
              manager,
              "$ManagerShimName = 'dsh-codex.cmd'\n$PackageVersion = '1.0.4'",
              "$ManagerShimName = 'dsh-codex.cmd'\n$ManagerStateName = 'dsh-codex-state.json'\n$PackageVersion = '1.0.4'",
              'manager state constant',
          )

          manager = replace_once(
              manager,
              "$OutputEncoding = $Utf8NoBom\n\nif ($Managed -and -not $PSBoundParameters.ContainsKey('Action')) {",
              "$OutputEncoding = $Utf8NoBom\n\n$ProfileWasExplicit = $PSBoundParameters.ContainsKey('Profile')\n$PortableRootWasExplicit = $PSBoundParameters.ContainsKey('PortableRoot')\n$ManagerTargetMode = $null\n\nif ($Managed -and -not $PSBoundParameters.ContainsKey('Action')) {",
              'explicit parameter markers',
          )

          state_functions = r'''function Get-ManagerStatePath {
    param([Parameter(Mandatory = $true)][string] $Directory)
    return Join-Path $Directory $ManagerStateName
}

function Read-ManagerState {
    param([Parameter(Mandatory = $true)][string] $Directory)

    $statePath = Get-ManagerStatePath -Directory $Directory
    if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { return $null }
    try {
        $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
    } catch {
        throw 'The saved dsh-codex target is unreadable. Re-run setup or pass -PortableRoot explicitly.'
    }

    $schema = $state.PSObject.Properties['schemaVersion']
    $modeProperty = $state.PSObject.Properties['mode']
    $profileProperty = $state.PSObject.Properties['profile']
    if ($null -eq $schema -or [string] $schema.Value -ne '1' -or
        $null -eq $modeProperty -or $null -eq $profileProperty) {
        throw 'The saved dsh-codex target has an unsupported format. Re-run setup or pass -PortableRoot explicitly.'
    }

    $mode = [string] $modeProperty.Value
    $savedProfile = [string] $profileProperty.Value
    if ($mode -notin @('portable', 'global') -or $savedProfile -notmatch '^[A-Za-z0-9._-]+$') {
        throw 'The saved dsh-codex target is invalid. Re-run setup or pass -PortableRoot explicitly.'
    }

    $savedPortableRoot = $null
    if ($mode -eq 'portable') {
        $rootProperty = $state.PSObject.Properties['portableRoot']
        if ($null -eq $rootProperty -or -not [string] $rootProperty.Value) {
            throw 'The saved DSH-Portable target is missing its folder. Re-run setup or pass -PortableRoot explicitly.'
        }
        $savedPortableRoot = Resolve-FullPath ([string] $rootProperty.Value)
    }

    return [pscustomobject]@{
        SchemaVersion = 1
        Mode = $mode
        Profile = $savedProfile
        PortableRoot = $savedPortableRoot
    }
}

function Write-ManagerState {
    param(
        [Parameter(Mandatory = $true)][string] $Directory,
        [Parameter(Mandatory = $true)] $Target
    )

    $portableRoot = if ($Target.Mode -eq 'portable') { $Target.Layout.Root } else { $null }
    $payload = [ordered]@{
        schemaVersion = 1
        mode = [string] $Target.Mode
        profile = [string] $Profile
        portableRoot = $portableRoot
    } | ConvertTo-Json -Compress

    $statePath = Get-ManagerStatePath -Directory $Directory
    $stagedState = Join-Path $Directory ('.dsh-codex-state-' + [guid]::NewGuid().ToString('N') + '.json')
    try {
        [System.IO.File]::WriteAllText($stagedState, $payload, $Utf8NoBom)
        Move-Item -LiteralPath $stagedState -Destination $statePath -Force
    } finally {
        if (Test-Path -LiteralPath $stagedState) {
            Remove-Item -LiteralPath $stagedState -Force -ErrorAction SilentlyContinue
        }
    }
}

'''
          marker = 'function Invoke-LatestManager {'
          if manager.count(marker) != 1:
              raise SystemExit('manager state insertion marker mismatch')
          manager = manager.replace(marker, state_functions + marker)

          global_target = r'''function New-GlobalTarget {
    param([switch] $Remembered)

    $globalDsh = Get-Command dsh -ErrorAction SilentlyContinue
    if ($null -eq $globalDsh) {
        if ($Remembered) {
            throw 'The remembered global DSH target is no longer available on PATH. Re-run setup to choose a target.'
        }
        throw 'The dsh command is not available on PATH.'
    }
    $globalNode = Get-Command node -ErrorAction SilentlyContinue
    if ($null -eq $globalNode) {
        if ($Remembered) {
            throw 'The remembered global DSH target no longer has Node.js on PATH. Re-run setup to choose a target.'
        }
        throw 'The dsh command exists, but Node.js is not available on PATH.'
    }
    return [pscustomobject]@{
        Mode = 'global'
        Layout = $null
        Executable = $globalDsh.Source
        Node = $globalNode.Source
        UsesPortableCli = $false
    }
}

'''
          marker = 'function Find-PortableFromCurrentDirectory {'
          if manager.count(marker) != 1:
              raise SystemExit('global target insertion marker mismatch')
          manager = manager.replace(marker, global_target + marker)

          manager = replace_once(
              manager,
              "    $layout = Find-PortableFromCurrentDirectory\n",
              "    if ($ManagerTargetMode -eq 'global') {\n        return New-GlobalTarget -Remembered\n    }\n\n    $layout = Find-PortableFromCurrentDirectory\n",
              'remembered global target branch',
          )

          old_global = """    if ($null -ne $globalDsh) {\n        $globalNode = Get-Command node -ErrorAction SilentlyContinue\n        if ($null -eq $globalNode) { throw 'The dsh command exists, but Node.js is not available on PATH.' }\n        return [pscustomobject]@{ Mode = 'global'; Layout = $null; Executable = $globalDsh.Source; Node = $globalNode.Source; UsesPortableCli = $false }\n    }\n"""
          if manager.count(old_global) != 1:
              raise SystemExit('global target replacement marker mismatch')
          manager = manager.replace(old_global, "    if ($null -ne $globalDsh) { return New-GlobalTarget }\n")

          manager_state_load = r'''$managerCommandRoot = Get-ManagerCommandRoot
if ($Managed) {
    $managerState = Read-ManagerState -Directory $managerCommandRoot
    if ($null -ne $managerState) {
        if (-not $ProfileWasExplicit) { $Profile = $managerState.Profile }
        if (-not $PortableRootWasExplicit) {
            $ManagerTargetMode = $managerState.Mode
            if ($managerState.Mode -eq 'portable') { $PortableRoot = $managerState.PortableRoot }
        }
    }
}
'''
          manager = replace_once(
              manager,
              '$managerCommandRoot = Get-ManagerCommandRoot\n',
              manager_state_load,
              'manager state load',
          )

          manager = replace_once(
              manager,
              "foreach ($name in @('dsh-codex-manager.ps1', 'dsh-codex.ps1', 'dsh-codex.cmd')) {",
              "foreach ($name in @('dsh-codex-manager.ps1', 'dsh-codex.ps1', 'dsh-codex.cmd', 'dsh-codex-state.json')) {",
              'cleanup state file',
          )
          manager = replace_once(
              manager,
              'foreach ($ownedFile in @($ManagerScriptName, $LegacyManagerScriptName, $ManagerShimName)) {',
              'foreach ($ownedFile in @($ManagerScriptName, $LegacyManagerScriptName, $ManagerShimName, $ManagerStateName)) {',
              'owned state file',
          )
          manager = replace_once(
              manager,
              "        Install-ManagerCommand -Directory $managerCommandRoot\n        $verb = if ($Action -eq 'Update') { 'Updated.' } else { 'Installed.' }",
              "        Install-ManagerCommand -Directory $managerCommandRoot\n        Write-ManagerState -Directory $managerCommandRoot -Target $target\n        $verb = if ($Action -eq 'Update') { 'Updated.' } else { 'Installed.' }",
              'manager state write',
          )
          manager_path.write_text(manager, encoding='utf-8')

          agents = Path('AGENTS.md')
          agents_text = agents.read_text(encoding='utf-8-sig').replace('1.0.3', '1.0.4')
          note_marker = "`dsh-codex update` resolves the latest immutable GitHub Release and verifies the\n"
          if agents_text.count(note_marker) != 1:
              raise SystemExit('AGENTS managed-state note marker mismatch')
          note = (
              "The installed `dsh-codex` command remembers its selected DSH mode, profile, and portable root in its own command directory. "
              "This state contains no credentials; an explicit `-PortableRoot` still overrides it.\n\n"
          )
          agents_text = agents_text.replace(note_marker, note + note_marker)
          agents.write_text(agents_text, encoding='utf-8')

          release_contract = Path('tests/release-contract.test.mjs')
          release_contract.write_text(
              release_contract.read_text().replace('1\\.0\\.3', '1\\.0\\.4').replace('1.0.3', '1.0.4')
          )

          tests_path = Path('tests/powershell-manager.test.mjs')
          tests = tests_path.read_text().replace('1\\.0\\.3', '1\\.0\\.4').replace('1.0.3', '1.0.4')

          test_marker = "windowsTest('reusable command uninstalls the portable plugin and removes itself', () => {"
          start = tests.index(test_marker)
          end = tests.index("windowsTest('reusable command works from Unicode paths containing spaces'", start)
          block = tests[start:end]
          assertion_marker = "    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), true)\n"
          if block.count(assertion_marker) != 1:
              raise SystemExit('saved target assertion marker mismatch')
          block = block.replace(
              assertion_marker,
              assertion_marker +
              "    const savedTarget = JSON.parse(readFileSync(join(commandRoot, 'dsh-codex-state.json'), 'utf8'))\n" +
              "    assert.deepEqual(savedTarget, {\n" +
              "      schemaVersion: 1,\n" +
              "      mode: 'portable',\n" +
              "      profile: 'web',\n" +
              "      portableRoot: realpathSync.native(root),\n" +
              "    })\n",
          )
          block = block.replace("], { cwd: root, encoding: 'utf8' })", "], { cwd: sandbox, encoding: 'utf8' })", 1)
          tests = tests[:start] + block + tests[end:]

          direct_marker = "windowsTest('direct uninstall removes only manager-owned files from a custom command directory', () => {"
          start = tests.index(direct_marker)
          end = tests.index("windowsTest('managed update runs only a checksum-matching immutable release manager'", start)
          block = tests[start:end]
          cmd_false = "    assert.equal(existsSync(join(commandRoot, 'dsh-codex.cmd')), false)\n"
          if block.count(cmd_false) != 1:
              raise SystemExit('state cleanup assertion marker mismatch')
          block = block.replace(cmd_false, cmd_false + "    assert.equal(existsSync(join(commandRoot, 'dsh-codex-state.json')), false)\n")
          tests = tests[:start] + block + tests[end:]

          managed_marker = "windowsTest('managed update runs only a checksum-matching immutable release manager', async () => {"
          start = tests.index(managed_marker)
          end = tests.index('function autoDryRunResult', start)
          block = tests[start:end]
          fixture_marker = "  try {\n    functionalPortableFixture(root)\n    server.listen(0, '127.0.0.1')\n"
          if block.count(fixture_marker) != 1:
              raise SystemExit('managed state fixture marker mismatch')
          block = block.replace(
              fixture_marker,
              "  try {\n    functionalPortableFixture(root)\n    mkdirSync(commandRoot, { recursive: true })\n" +
              "    writeFileSync(join(commandRoot, 'dsh-codex-state.json'), JSON.stringify({\n" +
              "      schemaVersion: 1, mode: 'portable', profile: 'web', portableRoot: realpathSync.native(root),\n" +
              "    }))\n    server.listen(0, '127.0.0.1')\n",
          )
          old_args = "        '-Managed', '-Action', 'Update', '-Profile', 'web',\n        '-PortableRoot', root, '-CommandRoot', commandRoot, '-NoModifyPath',\n"
          if block.count(old_args) != 1:
              raise SystemExit('managed state invocation marker mismatch')
          block = block.replace(old_args, "        '-Managed', '-Action', 'Update',\n        '-CommandRoot', commandRoot, '-NoModifyPath',\n")
          block = block.replace('      portableRoot: root,', '      portableRoot: realpathSync.native(root),', 1)
          tests = tests[:start] + block + tests[end:]
          tests_path.write_text(tests)

          release_path = Path('.github/workflows/release.yml')
          release_text = release_path.read_text()
          begin = release_text.index('  # BEGIN V104 PREP\n')
          end = release_text.index('  # END V104 PREP\n') + len('  # END V104 PREP\n')
          release_path.write_text(release_text[:begin] + release_text[end:])
          PY

          node --test tests/release-contract.test.mjs tests/release-notes.test.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.0.4-once.yml 2>/dev/null || true
          git rm -f .github/prepare-v1.0.4-trigger.txt 2>/dev/null || true
          git add package.json AGENTS.md dsh-codex.ps1 tests/release-contract.test.mjs tests/powershell-manager.test.mjs .github/workflows/release.yml
          git commit -m 'fix: remember the selected DSH target for managed commands'
          git push origin HEAD:main
  # END V104 PREP

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' /tmp/release.json)" == "true" ]]; then
              echo "Removing stale draft $RELEASE_TAG before a clean rebuild."
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
              echo "needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "$RELEASE_TAG is already published; immutable assets will not be replaced."
              echo "needed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Windows manager and friendly setup lifecycle
        shell: powershell
        run: node --test tests/powershell-manager.test.mjs tests/powershell-setup.test.mjs
        env:
          DSH_CODEX_TEST_USER_PATH: '1'

  release:
    needs: [preflight, verify, windows]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare beginner-facing release notes
        shell: bash
        run: |
          mkdir -p .release
          cat > .release/install.md <<'NOTES'
          <!-- dsh-codex-install -->
          ## 安装 / Install

          ### Windows（推荐） / Windows (recommended)

          打开 PowerShell，只复制这一行：  
          Open PowerShell and paste this one line:

          ```powershell
          curl.exe -fL https://github.com/WSL043/dsh-codex-subscription/releases/latest/download/dsh-codex-setup.ps1 -o "$env:TEMP\dsh-codex-setup.ps1"; if ($LASTEXITCODE -eq 0) { powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\dsh-codex-setup.ps1" }
          ```

          安装助手会先让你选择 **中文（简体）** 或 **English**，然后自动寻找 DSH。没有安装过时显示“安装”；已经安装过时显示“更新”；如果检测到多个 DSH，会显示编号让你选择。  
          Setup first asks for **中文（简体）** or **English**, then finds DSH automatically. It shows **Install** for a new setup, **Update** for an existing one, and a numbered picker when multiple DSH copies are found.

          如果 DSH 正在执行另一个插件操作，安装助手会提示等待后按 Enter 重试，不会删除锁文件或强行结束 DSH。  
          If DSH is already running another plugin operation, setup asks you to wait and press Enter to retry. It never deletes lock files or forcibly stops DSH.

          DSH-Portable 不需要另外安装 Node.js 或 pnpm，也不需要管理员权限。安装或更新完成后，请手动重启 DSH。  
          DSH-Portable does not require a separate Node.js or pnpm install or administrator access. Restart DSH manually after installation or update.

          ### 更新 / Update

          ```powershell
          dsh-codex update
          ```

          ### 卸载 / Uninstall

          ```powershell
          dsh-codex uninstall
          ```
          NOTES

      - name: Build immutable release assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          package="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          mv "$package" .artifacts/dsh-codex-subscription.tgz
          cp dsh-codex.ps1 .artifacts/dsh-codex.ps1
          cp dsh-codex-setup.ps1 .artifacts/dsh-codex-setup.ps1
          (cd .artifacts && sha256sum dsh-codex.ps1 > dsh-codex.ps1.sha256)
          for asset in \
            dsh-codex-subscription.tgz \
            dsh-codex.ps1 \
            dsh-codex.ps1.sha256 \
            dsh-codex-setup.ps1; do
            test -s ".artifacts/$asset"
          done
          tar -xOf .artifacts/dsh-codex-subscription.tgz package/package.json \
            | jq -e --arg version "$RELEASE_VERSION" '.version == $version' >/dev/null

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes "$(cat .release/install.md)" \
            --generate-notes \
            --draft

      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            .artifacts/dsh-codex-subscription.tgz \
            .artifacts/dsh-codex.ps1 \
            .artifacts/dsh-codex.ps1.sha256 \
            .artifacts/dsh-codex-setup.ps1 \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft release before publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,body,assets > .release/draft.json
          jq -e '.isDraft == true' .release/draft.json >/dev/null
          jq -r '.body' .release/draft.json | grep -Fq '<!-- dsh-codex-install -->'
          jq -e '.assets | length == 4' .release/draft.json >/dev/null
          for asset in \
            dsh-codex-subscription.tgz \
            dsh-codex.ps1 \
            dsh-codex.ps1.sha256 \
            dsh-codex-setup.ps1; do
            jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' \
              .release/draft.json >/dev/null
          done

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Cleanup failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi
