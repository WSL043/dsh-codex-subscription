name: Apply v1.0.3 hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/hotfix-v1.0.3.py 2>&1 | tee hotfix.log
      - name: Commit and push
        id: push
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json AGENTS.md dsh-codex.ps1 tests/release-contract.test.mjs tests/powershell-manager.test.mjs
          if git diff --cached --quiet; then
            echo 'No hotfix changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make dsh-codex callable under restricted PowerShell'
          git push origin HEAD:main
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        shell: bash
        run: |
          {
            echo "v1.0.3 hotfix at \`$GITHUB_SHA\`: patch=**$PATCH_OUTCOME**, push=**$PUSH_OUTCOME**"
            echo
            echo '```text'
            if [[ -f hotfix.log ]]; then tail -c 10000 hotfix.log; else echo '(no patch log)'; fi
            echo
            echo '```'
          } > hotfix-comment.md
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body-file hotfix-comment.md
      - name: Fail when patch or push fails
        if: steps.patch.outcome != 'success' || steps.push.outcome == 'failure'
        run: exit 1
