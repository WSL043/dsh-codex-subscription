name: Issue intake

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.issue.state == 'open' && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const labelNames = new Set(
              (context.payload.issue.labels ?? []).map(label => typeof label === 'string' ? label : label.name),
            )
            const isBug = labelNames.has('bug')
            const isFeature = labelNames.has('enhancement')
            if (!isBug && !isFeature) return
            const body = context.payload.issue.body ?? ''
            // A suggestion can include a complete failure report. Keep it here;
            // error words alone do not make a feature request incomplete.
            const isReport = isBug || /^### (?:Plugin|DSH) version\s*$/imu.test(body)

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const commentOnce = async (marker, body) => {
              if (comments.some(comment => comment.body?.includes(marker))) return
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${body}`,
              })
              comments.push({ body: `${marker}\n${body}` })
            }

            const acknowledged = comments.some(comment => /<!-- dsh-(?:maintenance-ack|feature-ack|misfiled) -->/u.test(comment.body ?? ''))
            if (context.payload.action === 'opened' && !acknowledged) {
              if (isReport) {
                await commentOnce(
                  '<!-- dsh-maintenance-ack -->',
                  'Thanks for the report. We\'ll reproduce it on the reported plugin and DSH versions, then follow up here with what we find. Related suggestions can stay in this issue.\n\n感谢反馈。我们会按你提供的插件和 DSH 版本复现，并在这里同步核查结果；相关建议也在这条 issue 里继续讨论，无需重新提交。',
                )
              } else {
                await commentOnce(
                  '<!-- dsh-feature-ack -->',
                  'Thanks for the suggestion. We\'ll first check whether DSH already provides this capability and whether it fits this plugin\'s scope, then follow up here.\n\n感谢建议。我们会先确认 DSH 是否已有对应能力，以及它是否适合由本插件负责，再在这里回复。',
                )
              }
            }

            if (!isReport) return
            const value = /^### Plugin version\s*\n+([^\n]+)/imu.exec(body)?.[1]?.trim()
            if (value?.toLowerCase() === 'not installed') return
            const version = /^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?=\s|$)/iu.exec(value ?? '')?.[0]
            const dshValue = /^### DSH version\s*\n+([^\n]+)/imu.exec(body)?.[1]?.trim() ?? ''
            const diagnostics = /^### Support diagnostics\s*\n+([\s\S]*?)(?=\n### |$)/imu.exec(body)?.[1] ?? ''
            const dshVersion = /^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?=\s|$)/iu.exec(dshValue)?.[0]
              ?? /\bDSH\s+(v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)(?=[^0-9A-Za-z.+-]|$)/iu.exec(diagnostics)?.[1]
            const missing = []
            if (!version) {
              missing.push([
                '<!-- dsh-version-check:missing -->',
                'Please edit this issue and provide the exact plugin version from Settings or `dsh plugin --profile web list dsh-codex-subscription --depth 0`. If installation never completed, enter `not installed`.\n\n请编辑这条 issue，补充设置页中的准确插件版本；如果未安装成功，请填 `not installed`。',
              ])
            }
            if (!dshVersion) {
              missing.push([
                '<!-- dsh-version-check:dsh-missing -->',
                'Please edit this issue and give the exact DSH version from About or startup output, for example `0.2.0-rc.2`.\n\n请编辑这条 issue，补充准确的 DSH 版本号（关于页或启动输出，例如 `0.2.0-rc.2`）。',
              ])
            }
            if (missing.length) {
              const unanswered = missing.filter(([marker]) => !comments.some(comment => comment.body?.includes(marker)))
              if (unanswered.length) await commentOnce(unanswered.map(([marker]) => marker).join('\n'), unanswered.map(([, text]) => text).join('\n\n'))
              if (!labelNames.has('waiting-for-reporter') && context.payload.issue.state_reason !== 'reopened') {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['waiting-for-reporter'] })
              }
            } else if (labelNames.has('waiting-for-reporter') && comments.some(comment => /<!-- dsh-version-check:(?:dsh-)?missing -->/u.test(comment.body ?? ''))) {
              for (const name of ['waiting-for-reporter', 'stale']) {
                if (!labelNames.has(name)) continue
                try {
                  await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name })
                } catch (error) {
                  if (error.status !== 404) throw error
                }
              }
            }
            if (!version) return
            const packageAt = async tag => {
              const response = await fetch(`https://registry.npmjs.org/dsh-codex-subscription/${tag}`)
              return response.ok ? response.json() : undefined
            }
            const { pathToFileURL } = require('node:url')
            const { resolve } = require('node:path')
            const script = resolve(process.env.GITHUB_WORKSPACE || process.cwd(), 'scripts/prepare-compat-release.mjs')
            const { declaresDshCompatibility, dshCompatibilityRange } = await import(pathToFileURL(script).href)
            const reported = dshVersion?.replace(/^v/iu, '')
            if (reported) {
              const [current, latestManifest] = await Promise.all([packageAt(version.replace(/^v/iu, '')), packageAt('latest')])
              const latestVersion = String(latestManifest?.version ?? '')
              const latestRange = dshCompatibilityRange(latestManifest)
              if (current && latestManifest && latestRange) {
                if (!declaresDshCompatibility(current, reported) && declaresDshCompatibility(latestManifest, reported)) {
                  await commentOnce(
                    '<!-- dsh-version-check:plugin-predates-dsh -->',
                    `Plugin ${version} does not declare support for DSH ${reported}, but the current release ${latestVersion} does. DSH only installs releases at least 24 hours old when you enter a bare package name, so enter the exact version, \`dsh-codex-subscription@${latestVersion}\`, then restart DSH.\n\n插件 ${version} 没有声明支持 DSH ${reported}，而当前版本 ${latestVersion} 已支持。只填包名时 DSH 只会装发布满 24 小时的版本，请填带版本号的 \`dsh-codex-subscription@${latestVersion}\`，然后重启 DSH。`,
                  )
                } else if (!declaresDshCompatibility(latestManifest, reported)) {
                  await commentOnce(
                    '<!-- dsh-version-check:dsh-untested -->',
                    `DSH ${reported} is not in the list of DSH versions that release ${latestVersion} declares support for (${latestRange.split(' || ').slice(-4).join(', ')}, ...). We will check whether it is newer than what has been tested; please also tell us if it works with one of the listed versions.\n\nDSH ${reported} 不在当前版本 ${latestVersion} 声明支持的 DSH 版本列表内（${latestRange.split(' || ').slice(-4).join('、')} 等）。我们会确认它是否比已验收的版本更新；如果换成列表中的版本可以正常使用，也请告诉我们。`,
                  )
                }
              }
            }

            const response = await fetch('https://registry.npmjs.org/dsh-codex-subscription/latest')
            if (!response.ok) return
            const latest = String((await response.json()).version ?? '')
            const parts = version => version.replace(/^v/iu, '').split(/[.-]/u).slice(0, 3).map(Number)
            const [major, minor, patch] = parts(version)
            const [latestMajor, latestMinor, latestPatch] = parts(latest)
            const older = major < latestMajor || (major === latestMajor && (minor < latestMinor || (minor === latestMinor && patch < latestPatch)))
            if (older) {
              await commentOnce(
                `<!-- dsh-version-check:outdated:${latest} -->`,
                `This report uses ${version}; the current release is ${latest}. Please update and say whether the problem still reproduces.`,
              )
            }
