name: Issue intake

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const labelNames = new Set(
              (context.payload.issue.labels ?? []).map(label => typeof label === 'string' ? label : label.name),
            )
            const isBug = labelNames.has('bug')
            const isFeature = labelNames.has('enhancement')
            if (!isBug && !isFeature) return

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const commentOnce = async (marker, body) => {
              if (comments.some(comment => comment.body?.includes(marker))) return
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${body}`,
              })
            }

            if (context.payload.action === 'opened' && isBug) {
              await commentOnce(
                '<!-- dsh-maintenance-ack -->',
                'Thanks for the report. We\'ll reproduce it on the reported plugin and DSH versions, then follow up here with what we find.\n\n感谢反馈。我们会按你提供的插件和 DSH 版本复现，并在这里同步核查结果。',
              )
            }

            const needInfo = () => github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['waiting-for-reporter'],
            })

            if (context.payload.action === 'opened' && isFeature) {
              const text = context.payload.issue.body ?? ''
              if (/不兼容|装不上|无法安装|安装失败|报错|崩溃|失败|incompatible|(?:can'?t|cannot|unable to|fails? to) install|error|crash|not working|doesn'?t work/iu.test(text)) {
                await commentOnce(
                  '<!-- dsh-misfiled -->',
                  'This reads like something that is not working rather than a new idea. Please open a Bug report instead (or edit this issue to include the plugin version, the DSH version, and the exact message), so we can reproduce it: https://github.com/WSL043/dsh-codex-subscription/issues/new?template=install-problem.yml\n\n这看起来是遇到了故障，而不是新功能建议。请改用 Bug 表单提交，或在本 issue 里补充插件版本、DSH 版本和完整提示，方便我们复现：https://github.com/WSL043/dsh-codex-subscription/issues/new?template=install-problem.yml',
                )
                await needInfo()
              }
              await commentOnce(
                '<!-- dsh-feature-ack -->',
                'Thanks for the suggestion. We\'ll first check whether DSH already provides this capability and whether it fits this plugin\'s scope, then follow up here.\n\n感谢建议。我们会先确认 DSH 是否已有对应能力，以及它是否适合由本插件负责，再在这里回复。',
              )
            }

            if (!isBug) return
            const body = context.payload.issue.body ?? ''
            const value = /^### Plugin version\s*\n+([^\n]+)/imu.exec(body)?.[1]?.trim()
            if (value?.toLowerCase() === 'not installed') return
            const version = /^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?=\s|$)/u.exec(value ?? '')?.[0]
            if (!version) {
              await commentOnce(
                '<!-- dsh-version-check:missing -->',
                'Please edit the report and provide the exact plugin version from Settings or `dsh plugin --profile web list dsh-codex-subscription --depth 0`. If installation never completed, enter `not installed`.',
              )
              await needInfo()
              return
            }

            const dshValue = /^### DSH version\s*\n+([^\n]+)/imu.exec(body)?.[1]?.trim() ?? ''
            const dshVersion = /^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?=\s|$)/u.exec(dshValue)?.[0]
            if (!dshVersion) {
              await commentOnce(
                '<!-- dsh-version-check:dsh-missing -->',
                'Please edit the report and give the exact DSH version (About, or startup output), for example `0.2.0-rc.2`, and how you run DSH (official desktop app, web, or DSH-Portable).\n\n请编辑 issue，补充准确的 DSH 版本号（关于页或启动输出，例如 `0.2.0-rc.2`）以及运行方式（官方桌面版 / 网页版 / DSH-Portable）。',
              )
              await needInfo()
            }
            const packageAt = async tag => {
              const response = await fetch(`https://registry.npmjs.org/dsh-codex-subscription/${tag}`)
              return response.ok ? response.json() : undefined
            }
            const supported = manifest => new Set(String(manifest?.peerDependencies?.['@deepseek-ai/dsh-llm'] ?? '').split('||').map(item => item.trim()).filter(Boolean))
            const reported = dshVersion?.replace(/^v/u, '')
            if (reported) {
              const [current, latestManifest] = await Promise.all([packageAt(version.replace(/^v/u, '')), packageAt('latest')])
              const latestVersion = String(latestManifest?.version ?? '')
              const latestSupports = supported(latestManifest)
              if (current && latestManifest && latestSupports.size) {
                if (!supported(current).has(reported) && latestSupports.has(reported)) {
                  await commentOnce(
                    '<!-- dsh-version-check:plugin-predates-dsh -->',
                    `Plugin ${version} does not declare support for DSH ${reported}, but the current release ${latestVersion} does. DSH only installs releases at least 24 hours old when you enter a bare package name, so enter the exact version, \`dsh-codex-subscription@${latestVersion}\`, then restart DSH.\n\n插件 ${version} 没有声明支持 DSH ${reported}，而当前版本 ${latestVersion} 已支持。只填包名时 DSH 只会装发布满 24 小时的版本，请填带版本号的 \`dsh-codex-subscription@${latestVersion}\`，然后重启 DSH。`,
                  )
                } else if (!latestSupports.has(reported)) {
                  await commentOnce(
                    '<!-- dsh-version-check:dsh-untested -->',
                    `DSH ${reported} is not in the list of DSH versions that release ${latestVersion} declares support for (${[...latestSupports].slice(-4).join(', ')}, ...). We will check whether it is newer than what has been tested; please also tell us if it works with one of the listed versions.\n\nDSH ${reported} 不在当前版本 ${latestVersion} 声明支持的 DSH 版本列表内（${[...latestSupports].slice(-4).join('、')} 等）。我们会确认它是否比已验收的版本更新；如果换成列表中的版本可以正常使用，也请告诉我们。`,
                  )
                }
              }
            }

            const response = await fetch('https://registry.npmjs.org/dsh-codex-subscription/latest')
            if (!response.ok) return
            const latest = String((await response.json()).version ?? '')
            const parts = version => version.replace(/^v/u, '').split(/[.-]/u).slice(0, 3).map(Number)
            const [major, minor, patch] = parts(version)
            const [latestMajor, latestMinor, latestPatch] = parts(latest)
            const older = major < latestMajor || (major === latestMajor && (minor < latestMinor || (minor === latestMinor && patch < latestPatch)))
            if (older) {
              await commentOnce(
                `<!-- dsh-version-check:outdated:${latest} -->`,
                `This report uses ${version}; the current release is ${latest}. Please update and say whether the problem still reproduces.`,
              )
            }
