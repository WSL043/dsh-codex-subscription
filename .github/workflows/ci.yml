name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Pack release artifact
        run: |
          pnpm pack --pack-destination .artifacts
          artifact="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$artifact"
          test -s "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-codex-subscription-${{ github.sha }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/powershell-manager.test.mjs
