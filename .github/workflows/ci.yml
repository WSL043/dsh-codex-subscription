name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Pack release artifact
        run: |
          pnpm pack --pack-destination .artifacts
          cp dsh-codex.ps1 .artifacts/dsh-codex.ps1
          (cd .artifacts && sha256sum dsh-codex.ps1 > dsh-codex.ps1.sha256)
          artifact="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$artifact"
          test -s "$artifact"
          test -s .artifacts/dsh-codex.ps1
          test -s .artifacts/dsh-codex.ps1.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: dsh-codex-subscription-${{ github.sha }}
          path: |
            .artifacts/*.tgz
            .artifacts/dsh-codex.ps1
            .artifacts/dsh-codex.ps1.sha256
          if-no-files-found: error
          include-hidden-files: true

  windows-powershell:
    name: Windows PowerShell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Windows installer lifecycle
        run: node --test tests/powershell-manager.test.mjs
        env:
          DSH_CODEX_TEST_USER_PATH: '1'
