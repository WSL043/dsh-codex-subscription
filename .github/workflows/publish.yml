name: Release and publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@v6

      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Releases can only be published from main.' >&2
            exit 1
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' /tmp/release.json)" == "true" ]]; then
              echo "$RELEASE_TAG is a stale draft and will be rebuilt by the release job."
              echo "needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "$RELEASE_TAG is already published; immutable assets will not be replaced."
              echo "needed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "$RELEASE_TAG already points to $tag_sha instead of $GITHUB_SHA." >&2
                exit 1
              fi
            fi
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Windows manager compatibility and thin setup lifecycle
        shell: powershell
        run: node --test tests/powershell-manager.test.mjs tests/thin-installer.test.mjs
        env:
          DSH_CODEX_TEST_USER_PATH: '1'

  release:
    needs: [preflight, verify, windows]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Remove stale draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi

      - name: Prepare beginner-facing release notes
        shell: bash
        run: |
          mkdir -p .release
          cat > .release/install.md <<'NOTES'
          ## 更新内容 / What's new

          - Windows 安装改为轻量助手，直接调用 DSH 官方插件命令 / Windows setup is now a lightweight launcher for the official DSH plugin command
          - 不再为首次安装下载 pnpm、创建常驻管理器或重复下载插件 / First install no longer downloads pnpm, creates a resident manager, or downloads the plugin twice
          - 修复全新 profile 的安装判断错误 / Fixes installation on a completely new profile

          <!-- dsh-codex-install -->
          ## 安装 / Install

          ### Windows 安装助手 / Windows guided install

          打开 PowerShell，只复制这一行：
          Open PowerShell and paste this one line:

          ```powershell
          irm 'https://github.com/WSL043/dsh-codex-subscription/releases/latest/download/dsh-codex-setup.ps1' | iex
          ```

          助手只查找当前目录、系统命令和常见 DSH-Portable 位置，然后执行一次官方 `plugin add`。无需管理员权限，完成后请手动重启 DSH。
          Setup checks the current folder, the system command, and common DSH-Portable locations, then runs the official `plugin add` once. It needs no administrator access. Restart DSH manually afterward.

          ### macOS、Linux，或已有 dsh / macOS, Linux, or an existing dsh command

          ```sh
          dsh plugin --profile web add dsh-codex-subscription
          dsh plugin --profile web list dsh-codex-subscription --depth 0
          dsh --profile web --dump-config
          ```

          安装后手动重启 DSH。列表中应只有一个 `dsh-codex-subscription`，配置中应只有一个 `codex-subscription` 条目。
          Restart DSH manually. The plugin list should contain one `dsh-codex-subscription`, and the config should contain one `codex-subscription` entry.

          ### 通用更新与卸载 / Universal update and uninstall

          ```sh
          dsh plugin --profile web update dsh-codex-subscription
          dsh plugin --profile web list dsh-codex-subscription --depth 0
          dsh --profile web --dump-config
          dsh plugin --profile web remove dsh-codex-subscription
          ```
          NOTES

      - name: Build immutable release assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          package="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          mv "$package" .artifacts/dsh-codex-subscription.tgz
          cp dsh-codex.ps1 .artifacts/dsh-codex.ps1
          cp dsh-codex-setup.ps1 .artifacts/dsh-codex-setup.ps1
          (cd .artifacts && sha256sum dsh-codex.ps1 > dsh-codex.ps1.sha256)
          for asset in \
            dsh-codex-subscription.tgz \
            dsh-codex.ps1 \
            dsh-codex.ps1.sha256 \
            dsh-codex-setup.ps1; do
            test -s ".artifacts/$asset"
          done
          tar -xOf .artifacts/dsh-codex-subscription.tgz package/package.json \
            | jq -e --arg version "$RELEASE_VERSION" '.version == $version' >/dev/null

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file .release/install.md \
            --draft

      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            .artifacts/dsh-codex-subscription.tgz \
            .artifacts/dsh-codex.ps1 \
            .artifacts/dsh-codex.ps1.sha256 \
            .artifacts/dsh-codex-setup.ps1 \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft release before publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,body,assets > .release/draft.json
          jq -e '.isDraft == true' .release/draft.json >/dev/null
          jq -r '.body' .release/draft.json | grep -Fq '<!-- dsh-codex-install -->'
          jq -e '.assets | length == 4' .release/draft.json >/dev/null
          for asset in \
            dsh-codex-subscription.tgz \
            dsh-codex.ps1 \
            dsh-codex.ps1.sha256 \
            dsh-codex-setup.ps1; do
            jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' \
              .release/draft.json >/dev/null
          done

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Cleanup failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi

  publish-npm:
    needs: [preflight, release]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.needed == 'false' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const tag = process.env.RELEASE_TAG
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package version ${version}.`)
          }
          NODE

      - name: Verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in \
            dsh-codex-subscription.tgz \
            dsh-codex.ps1 \
            dsh-codex.ps1.sha256 \
            dsh-codex-setup.ps1
          do
            grep -Fxq "$asset" <<<"$assets" || {
              echo "Missing release asset: $asset" >&2
              exit 1
            }
          done

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build

      - name: Verify committed build output
        run: git diff --exit-code -- lib

      - name: Check whether npm version already exists
        id: npm-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-codex-subscription@$version" version >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "dsh-codex-subscription@$version is already published; skipping duplicate npm publish."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        if: steps.npm-version.outputs.needed == 'true'
        run: npm publish --access public
