name: Release and publish
run-name: Release ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional correlation id used by the compatibility autopilot
        required: false
        type: string
      release_kind:
        description: Release-note template
        required: false
        default: feature
        type: choice
        options: [feature, compatibility]
      dsh_version:
        description: Exact accepted DSH version for a compatibility release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@v6

      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Releases can only be published from main.' >&2
            exit 1
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' /tmp/release.json)" == "true" ]]; then
              echo "$RELEASE_TAG is a stale draft and will be rebuilt by the release job."
              echo "needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "$RELEASE_TAG is already published; immutable assets will not be replaced."
              echo "needed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "$RELEASE_TAG already points to $tag_sha instead of $GITHUB_SHA." >&2
                exit 1
              fi
            fi
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Pack candidate for official acceptance
        run: |
          mkdir -p .candidate
          pnpm pack --pack-destination .candidate
          package="$(find .candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          test -s "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Windows manager compatibility and thin setup lifecycle
        shell: powershell
        run: node --test tests/powershell-manager.test.mjs tests/thin-installer.test.mjs
        env:
          DSH_CODEX_TEST_USER_PATH: '1'

  official-acceptance:
    name: Official DSH end-to-end acceptance
    needs: [preflight, verify]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate
      - name: Official DSH end-to-end acceptance
        shell: powershell
        run: |
          $package = (Get-ChildItem -LiteralPath .candidate -Filter '*.tgz' -File | Select-Object -First 1).FullName
          if (-not $package) { throw 'Candidate package artifact was not downloaded.' }
          .\.github\scripts\accept-official-release.ps1 -PackagePath $package -DshRunner pnpm

  release:
    needs: [preflight, verify, windows, official-acceptance]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success' && needs.windows.result == 'success' && needs.official-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate

      - name: Remove stale draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi

      - name: Prepare beginner-facing release notes
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          REQUESTED_DSH_VERSION: ${{ inputs.dsh_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          current_dsh="$(node -p "require('./compatibility.json').latestTested")"
          if [[ "${RELEASE_KIND:-feature}" == 'compatibility' ]]; then
            test -n "${REQUESTED_DSH_VERSION:-}"
            test "$REQUESTED_DSH_VERSION" = "$current_dsh"
          fi
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            cat > .release/install.md <<NOTES
          ## Beta 更新 / Beta preview

          - 输入框支持为兼容的 Codex 模型切换标准或高速 / Switch supported Codex models between Standard and Fast in the composer
          - 高速模式显示为闪电，Spark 会自动隐藏不适用的入口 / Fast is shown as a lightning icon; Spark hides the unsupported control

          <!-- dsh-codex-install -->
          ## 安装 Beta / Install the Beta

          \`\`\`sh
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web add dsh-codex-subscription@$RELEASE_VERSION
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web list dsh-codex-subscription --depth 0
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 --profile web --dump-config
          \`\`\`

          安装后手动重启 DSH。Beta 不会替换 npm 的稳定版标签。
          Restart DSH manually. This Beta does not replace npm's stable tag.

          ## 卸载 / Uninstall

          \`\`\`sh
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web remove dsh-codex-subscription
          \`\`\`
          NOTES
            exit 0
          fi
          if [[ "${RELEASE_KIND:-feature}" == 'compatibility' ]]; then
            cat > .release/install.md <<NOTES
          ## DSH 兼容更新 / DSH compatibility

          - 已支持 DeepSeek Harness \`$current_dsh\` / Added support for DeepSeek Harness \`$current_dsh\`
          - 支持在官方 DSH Web 中安装、更新和卸载 / Supports install, update, and uninstall in official DSH Web

          NOTES
          else
            cat > .release/install.md <<'NOTES'
          ## 更新内容 / What's new

          - 浏览器授权完成后，登录页会自动显示已登录，无需切换设置页 / Completed browser authorization now appears as signed in without leaving and reopening Settings
          - 登录回调异常时会复核真实账户状态，避免把成功授权显示成失败 / Sign-in recovery checks the real account state instead of showing a successful authorization as failed
          - 取消登录会立即响应，不再因授权窗口仍在收尾而卡住 / Cancel responds immediately even while the authorization window is finishing

          NOTES
          fi
          cat >> .release/install.md <<'NOTES'

          <!-- dsh-codex-install -->
          ## 安装 / Install

          ### Windows 安装助手 / Windows guided install

          打开 PowerShell，只复制这一行：
          Open PowerShell and paste this one line:

          ```powershell
          irm 'https://github.com/WSL043/dsh-codex-subscription/releases/latest/download/dsh-codex-setup.ps1' | iex
          ```

          助手会使用当前目录、系统命令、常见位置或正在运行的 DSH-Portable；都找不到时才使用固定版本的官方 npm 入口。无需管理员权限，完成后请手动重启 DSH。
          Setup uses the current folder, a system command, a common location, or a running DSH-Portable; only then does it fall back to the pinned official npm route. It runs `plugin add` once, needs no administrator access, and does not restart DSH.

          ### 官方 npm 方式 / Official npm route

          ```sh
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web add dsh-codex-subscription
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web list dsh-codex-subscription --depth 0
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 --profile web --dump-config
          ```

          安装后手动重启 DSH。列表中应只有一个 `dsh-codex-subscription`，配置中应只有一个 `codex-subscription` 条目。
          Restart DSH manually. The plugin list should contain one `dsh-codex-subscription`, and the config should contain one `codex-subscription` entry.

          ### 通用更新与卸载 / Universal update and uninstall

          ```sh
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web update dsh-codex-subscription
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web list dsh-codex-subscription --depth 0
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 --profile web --dump-config
          npx -y @deepseek-ai/dsh@0.1.1-rc.1 plugin --profile web remove dsh-codex-subscription
          ```
          NOTES

      - name: Build immutable release assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          package="$(find .candidate -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          cp "$package" .artifacts/dsh-codex-subscription.tgz
          test -s .artifacts/dsh-codex-subscription.tgz
          if [[ "$IS_PRERELEASE" != 'true' ]]; then
            cp dsh-codex.ps1 .artifacts/dsh-codex.ps1
            cp dsh-codex-setup.ps1 .artifacts/dsh-codex-setup.ps1
            (cd .artifacts && sha256sum dsh-codex.ps1 > dsh-codex.ps1.sha256)
            for asset in dsh-codex.ps1 dsh-codex.ps1.sha256 dsh-codex-setup.ps1; do
              test -s ".artifacts/$asset"
            done
          fi
          tar -xOf .artifacts/dsh-codex-subscription.tgz package/package.json \
            | jq -e --arg version "$RELEASE_VERSION" '.version == $version' >/dev/null

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          flags=()
          if [[ "$IS_PRERELEASE" == 'true' ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file .release/install.md \
            --draft "${flags[@]}"

      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" .artifacts/* --repo "$GITHUB_REPOSITORY"

      - name: Verify draft release before publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,body,assets > .release/draft.json
          jq -e '.isDraft == true' .release/draft.json >/dev/null
          jq -e --argjson prerelease "$IS_PRERELEASE" '.isPrerelease == $prerelease' .release/draft.json >/dev/null
          jq -r '.body' .release/draft.json | grep -Fq '<!-- dsh-codex-install -->'
          expected=1
          assets=(dsh-codex-subscription.tgz)
          if [[ "$IS_PRERELEASE" != 'true' ]]; then
            expected=4
            assets+=(dsh-codex.ps1 dsh-codex.ps1.sha256 dsh-codex-setup.ps1)
          fi
          jq -e --argjson expected "$expected" '.assets | length == $expected' .release/draft.json >/dev/null
          for asset in "${assets[@]}"; do
            jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' \
              .release/draft.json >/dev/null
          done

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Cleanup failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          fi

  publish-npm:
    needs: [preflight, release]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.needed == 'false' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const tag = process.env.RELEASE_TAG
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (!/^v\d+\.\d+\.\d+(?:-beta\.\d+)?$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} does not match package version ${version}.`)
          }
          NODE

      - name: Verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          required=(dsh-codex-subscription.tgz)
          if [[ "$IS_PRERELEASE" != 'true' ]]; then
            required+=(dsh-codex.ps1 dsh-codex.ps1.sha256 dsh-codex-setup.ps1)
          fi
          for asset in "${required[@]}"
          do
            grep -Fxq "$asset" <<<"$assets" || {
              echo "Missing release asset: $asset" >&2
              exit 1
            }
          done

      - name: Download the accepted package artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          mkdir -p .release-artifact
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern dsh-codex-subscription.tgz --dir .release-artifact

      - name: Verify accepted package metadata
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          tar -xOf .release-artifact/dsh-codex-subscription.tgz package/package.json > .release-artifact/package.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const expected = JSON.parse(readFileSync('package.json', 'utf8'))
          const actual = JSON.parse(readFileSync('.release-artifact/package.json', 'utf8'))
          if (actual.name !== expected.name || actual.version !== expected.version) {
            throw new Error(`Release package is ${actual.name}@${actual.version}; expected ${expected.name}@${expected.version}.`)
          }
          if (process.env.RELEASE_TAG !== `v${actual.version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match accepted package ${actual.version}.`)
          }
          NODE

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build

      - name: Verify committed build output
        run: git diff --exit-code -- lib

      - name: Check whether npm version already exists
        id: npm-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-codex-subscription@$version" version >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "dsh-codex-subscription@$version is already published; skipping duplicate npm publish."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        if: steps.npm-version.outputs.needed == 'true'
        env:
          NPM_TAG: ${{ needs.preflight.outputs.npm_tag }}
        run: npm publish ./.release-artifact/dsh-codex-subscription.tgz --access public --tag "$NPM_TAG"
