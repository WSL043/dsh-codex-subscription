name: Apply Windows setup hotfix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch setup, tests, and release idempotency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          setup_path = Path('dsh-codex-setup.ps1')
          setup = setup_path.read_text(encoding='utf-8-sig')

          zh_old = "        StatusFailure = '无法确认当前插件状态，为避免误判，安装助手已停止。'\n        LocalManager = '正在使用指定的本地安装组件。'"
          zh_new = "        StatusFailure = '无法确认当前插件状态，为避免误判，安装助手已停止。'\n        Busy = 'DSH 正在执行另一个插件操作。请等它完成后再重试。'\n        BusyPrompt = '按 Enter 重试，或输入 Q 退出'\n        LocalManager = '正在使用指定的本地安装组件。'"
          en_old = "        StatusFailure = 'The current plugin state could not be confirmed, so setup stopped instead of guessing.'\n        LocalManager = 'Using the specified local installer component.'"
          en_new = "        StatusFailure = 'The current plugin state could not be confirmed, so setup stopped instead of guessing.'\n        Busy = 'DSH is already running another plugin operation. Wait for it to finish, then retry.'\n        BusyPrompt = 'Press Enter to retry, or enter Q to quit'\n        LocalManager = 'Using the specified local installer component.'"
          if zh_old not in setup or en_old not in setup:
              raise SystemExit('message anchors changed')
          setup = setup.replace(zh_old, zh_new, 1).replace(en_old, en_new, 1)

          invoke_start = setup.index('function Invoke-TargetDshCapture {')
          status_start = setup.index('function Get-InstalledPackageStatus {')
          invoke_block = r'''function Invoke-TargetDshCapture {
              param(
                  [Parameter(Mandatory = $true)] $Target,
                  [Parameter(Mandatory = $true)][string[]] $Arguments
              )

              $oldDshHome = $env:DSH_HOME
              $oldDshPortable = $env:DSH_PORTABLE
              $oldTelemetry = $env:DSH_TELEMETRY_MODE
              try {
                  if ($Target.Mode -eq 'portable') {
                      $env:DSH_HOME = $Target.Layout.DshHome
                      $env:DSH_PORTABLE = '1'
                      $env:DSH_TELEMETRY_MODE = 'DISABLED'
                  }
                  $allArguments = if ($Target.Mode -eq 'portable' -and -not $Target.UsesPortableCli) {
                      @($Target.Layout.Dsh) + $Arguments
                  } else {
                      $Arguments
                  }
                  $previousErrorAction = $ErrorActionPreference
                  $ErrorActionPreference = 'Continue'
                  try {
                      $output = @(& $Target.Executable @allArguments 2>&1 | ForEach-Object { [string] $_ })
                      $exitCode = $LASTEXITCODE
                  } finally {
                      $ErrorActionPreference = $previousErrorAction
                  }
                  if ($exitCode -ne 0) {
                      $detail = ($output -join [Environment]::NewLine).Trim()
                      if (-not $detail) { $detail = "dsh returned exit code $exitCode." }
                      throw $detail
                  }
                  return ($output -join [Environment]::NewLine)
              } finally {
                  $env:DSH_HOME = $oldDshHome
                  $env:DSH_PORTABLE = $oldDshPortable
                  $env:DSH_TELEMETRY_MODE = $oldTelemetry
              }
          }

          function Test-DshPluginBusyError {
              param([Parameter(Mandatory = $true)][string] $Message)
              return $Message -match '(?i)another\s+DSH\s+plugin\s+command\s+is\s+already\s+running'
          }

          function Get-InstalledPackageStatusWithRetry {
              param([Parameter(Mandatory = $true)] $Target)

              while ($true) {
                  try {
                      return Get-InstalledPackageStatus -Target $Target
                  } catch {
                      $message = [string] $_.Exception.Message
                      if (-not (Test-DshPluginBusyError -Message $message)) {
                          throw ((T 'StatusFailure') + ' ' + $message)
                      }
                      Write-Host ''
                      Write-Host (T 'Busy') -ForegroundColor Yellow
                      $choice = Read-Host (T 'BusyPrompt')
                      if ($choice -and $choice.Trim() -match '^(?i)q$') { exit 0 }
                      Write-Host (T 'CheckingState')
                  }
              }
          }

          '''
          setup = setup[:invoke_start] + invoke_block + setup[status_start:]

          status_old = """    try {
                  $status = Get-InstalledPackageStatus -Target $target
              } catch {
                  throw ((T 'StatusFailure') + ' ' + $_.Exception.Message)
              }
          """
          if status_old not in setup:
              raise SystemExit('status invocation anchor changed')
          setup = setup.replace(status_old, "    $status = Get-InstalledPackageStatusWithRetry -Target $target\n", 1)

          manager_start = setup.index("        $managerArguments = @('-Action', $effectiveAction, '-Profile', $Profile)")
          manager_end = setup.index("\n\n        Write-Host ''", manager_start)
          manager_block = r'''        $managerArguments = @(
                      '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                      '-File', $manager.Path,
                      '-Action', $effectiveAction,
                      '-Profile', $Profile
                  )
                  if ($target.Mode -eq 'portable') {
                      $managerArguments += @('-PortableRoot', $target.Root)
                  }

                  while ($true) {
                      $previousErrorAction = $ErrorActionPreference
                      $ErrorActionPreference = 'Continue'
                      try {
                          & powershell.exe @managerArguments *> $log
                          $managerExitCode = $LASTEXITCODE
                      } finally {
                          $ErrorActionPreference = $previousErrorAction
                      }
                      if ($managerExitCode -eq 0) { break }

                      $detail = ''
                      if (Test-Path -LiteralPath $log -PathType Leaf) {
                          $detail = [string] (Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue)
                      }
                      if (-not $detail.Trim()) {
                          $detail = "Installer manager exited with code $managerExitCode."
                      }
                      if (Test-DshPluginBusyError -Message $detail) {
                          Write-Host ''
                          Write-Host (T 'Busy') -ForegroundColor Yellow
                          $choice = Read-Host (T 'BusyPrompt')
                          if ($choice -and $choice.Trim() -match '^(?i)q$') { exit 0 }
                          if ($effectiveAction -eq 'Update') {
                              Write-Host (T 'Updating')
                          } else {
                              Write-Host (T 'Installing')
                          }
                          continue
                      }
                      throw $detail.Trim()
                  }'''
          setup = setup[:manager_start] + manager_block + setup[manager_end:]
          setup_path.write_text(setup, encoding='utf-8-sig')

          tests_path = Path('tests/powershell-setup.test.mjs')
          tests = tests_path.read_text(encoding='utf-8')
          static_anchor = "  assert.match(source, /Get-FileDigest -Path \\$manager/u)\n  assert.doesNotMatch(source, /Invoke-Expression|\\biex\\b/iu)"
          static_replacement = "  assert.match(source, /Get-FileDigest -Path \\$manager/u)\n  assert.match(source, /Get-InstalledPackageStatusWithRetry/u)\n  assert.match(source, /powershell\\.exe @managerArguments/u)\n  assert.doesNotMatch(source, /& \\$manager\\.Path @managerArguments/u)\n  assert.doesNotMatch(source, /Invoke-Expression|\\biex\\b/iu)"
          if static_anchor not in tests:
              raise SystemExit('setup static-test anchor changed')
          tests = tests.replace(static_anchor, static_replacement, 1)

          if "real setup invocation passes named manager arguments" not in tests:
              tests += r'''

          windowsTest('real setup invocation passes named manager arguments through child PowerShell', () => {
            const sandbox = mkdtempSync(join(tmpdir(), 'dsh-codex-friendly-manager-'))
            const root = join(sandbox, 'DSH Portable')
            const manager = join(sandbox, 'fake-manager.ps1')
            const marker = join(sandbox, 'manager.json')
            try {
              portableFixture(root)
              writeFileSync(manager, String.raw`[CmdletBinding()]
          param(
            [ValidateSet('Install', 'Update', 'Uninstall')][string] $Action,
            [string] $Profile,
            [string] $PortableRoot
          )
          [IO.File]::WriteAllText($env:DSH_CODEX_TEST_MANAGER_MARKER, (@{
            action = $Action
            profile = $Profile
            portableRoot = $PortableRoot
          } | ConvertTo-Json -Compress))
          `)
              const result = runSetup([
                '-Language', 'en-US', '-PortableRoot', root, '-ManagerPath', manager,
              ], { env: { DSH_CODEX_TEST_MANAGER_MARKER: marker } })
              assert.equal(result.status, 0, result.stderr || result.stdout)
              const invocation = JSON.parse(readFileSync(marker, 'utf8'))
              assert.equal(invocation.action, 'Install')
              assert.equal(invocation.profile, 'web')
              assert.equal(invocation.portableRoot.toLowerCase(), realpathSync.native(root).toLowerCase())
              assert.match(result.stdout, /Installation completed\./u)
            } finally {
              rmSync(sandbox, { recursive: true, force: true })
            }
          })

          windowsTest('busy DSH plugin state offers a retry instead of reporting a terminal failure', () => {
            const sandbox = mkdtempSync(join(tmpdir(), 'dsh-codex-friendly-busy-'))
            const root = join(sandbox, 'DSH Portable')
            try {
              portableFixture(root, {})
              const dsh = join(root, 'app', 'node_modules', '@deepseek-ai', 'dsh', 'lib', 'bin.js')
              writeFileSync(dsh, String.raw`
          const fs = require('node:fs')
          const path = require('node:path')
          const marker = path.join(process.env.DSH_HOME, 'busy-once.txt')
          if (!fs.existsSync(marker)) {
            fs.writeFileSync(marker, '1')
            process.stderr.write('DSH plugin command failed: Another DSH plugin command is already running.\n')
            process.exit(23)
          }
          process.stdout.write(JSON.stringify([{ dependencies: {} }]))
          `)
              const result = runSetup([
                '-Language', 'en-US', '-PortableRoot', root, '-DryRun',
              ], { input: '\r\n' })
              assert.equal(result.status, 0, result.stderr || result.stdout)
              const plan = parsePlan(result.stdout)
              assert.equal(plan.action, 'Install')
              assert.match(result.stdout, /already running another plugin operation/iu)
              assert.doesNotMatch(result.stdout, /The operation did not complete\./u)
            } finally {
              rmSync(sandbox, { recursive: true, force: true })
            }
          })
          '''
          tests_path.write_text(tests, encoding='utf-8')

          release_path = Path('.github/workflows/release.yml')
          release = release_path.read_text(encoding='utf-8')
          if 'Retarget stale tag from a deleted release' not in release:
              anchor = '      - name: Prepare user-facing release notes\n'
              if anchor not in release:
                  raise SystemExit('release workflow anchor changed')
              step = '''      - name: Retarget stale tag from a deleted release
                  if: steps.existing.outputs.needed == 'true'
                  env:
                    RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  shell: bash
                  run: |
                    if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "$RELEASE_TAG tag exists without a Release; retargeting it to the validated main commit."
                      git push origin ":refs/tags/$RELEASE_TAG"
                    fi

          '''
              release = release.replace(anchor, step + anchor, 1)
          release_path.write_text(release, encoding='utf-8')

          publish_path = Path('.github/workflows/publish.yml')
          publish = publish_path.read_text(encoding='utf-8')
          old_publish = '''      - name: Publish with npm Trusted Publishing
                  run: npm publish --access public'''
          new_publish = '''      - name: Check whether npm version already exists
                  id: npm-version
                  shell: bash
                  run: |
                    version="$(node -p "require('./package.json').version")"
                    if npm view "dsh-codex-subscription@$version" version >/dev/null 2>&1; then
                      echo "needed=false" >> "$GITHUB_OUTPUT"
                      echo "dsh-codex-subscription@$version is already published; skipping duplicate npm publish."
                    else
                      echo "needed=true" >> "$GITHUB_OUTPUT"
                    fi

                - name: Publish with npm Trusted Publishing
                  if: steps.npm-version.outputs.needed == 'true'
                  run: npm publish --access public'''
          if old_publish not in publish:
              raise SystemExit('publish workflow anchor changed')
          publish = publish.replace(old_publish, new_publish, 1)
          publish_path.write_text(publish, encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = '1.0.1'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit the validated-source hotfix
        shell: bash
        run: |
          git rm .github/workflows/setup-hotfix-once.yml
          git config user.name WSL043
          git config user.email 100819018+WSL043@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: make Windows setup executable and retry DSH busy locks"
          git push origin HEAD:main
