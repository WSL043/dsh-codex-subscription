name: Release Notes

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Repair current release notes when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          tag="v$version"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag does not exist yet; the normal Release workflow will create it after CI."
            exit 0
          fi

          mkdir -p .release
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > .release/current.md
          if grep -Fq '<!-- dsh-codex-install -->' .release/current.md; then
            echo "$tag already contains the install section."
            exit 0
          fi

          cat > .release/install.md <<'NOTES'
          <!-- dsh-codex-install -->
          ## 安装 / Install

          ### Windows（推荐） / Windows (recommended)

          打开 PowerShell，只复制这一行：  
          Open PowerShell and paste this one line:

          ```powershell
          curl.exe -fL https://github.com/WSL043/dsh-codex-subscription/releases/latest/download/dsh-codex-setup.ps1 -o "$env:TEMP\dsh-codex-setup.ps1"; if ($LASTEXITCODE -eq 0) { powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\dsh-codex-setup.ps1" }
          ```

          安装助手会先让你选择 **中文（简体）** 或 **English**，然后自动寻找 DSH。没有安装过时显示“安装”；已经安装过时显示“更新”；如果检测到多个 DSH，会显示编号让你选择。  
          Setup first asks for **中文（简体）** or **English**, then finds DSH automatically. It shows **Install** for a new setup, **Update** for an existing one, and a numbered picker when multiple DSH copies are found.

          DSH-Portable 不需要另外安装 Node.js 或 pnpm，也不需要管理员权限。安装或更新完成后，请手动重启 DSH。  
          DSH-Portable does not require a separate Node.js or pnpm install or administrator access. Restart DSH manually after installation or update.

          ### 更新 / Update

          ```powershell
          dsh-codex update
          ```

          ### 卸载 / Uninstall

          ```powershell
          dsh-codex uninstall
          ```

          NOTES

          cat .release/install.md .release/current.md > .release/release-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file .release/release-notes.md
          echo "Repaired $tag release notes."
