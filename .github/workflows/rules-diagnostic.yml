name: Rules Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect effective rules and immutable release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          gh api "${api_headers[@]}" "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=branch,tag,push" > rulesets.json 2>rulesets.err
          rulesets_status=$?
          gh api "${api_headers[@]}" "repos/$GITHUB_REPOSITORY/immutable-releases" > immutable.json 2>immutable.err
          immutable_status=$?
          gh api "${api_headers[@]}" "repos/$GITHUB_REPOSITORY/rulesets/rule-suites?per_page=100" > suites.json 2>suites.err
          suites_status=$?

          {
            echo 'Rules / immutable release diagnostic for v1.0.1'
            echo
            echo "rulesets API status: $rulesets_status"
            echo '```json'
            if [[ $rulesets_status -eq 0 ]]; then cat rulesets.json; else cat rulesets.err; fi
            echo
            echo '```'
            echo
            echo "immutable releases API status: $immutable_status"
            echo '```json'
            if [[ $immutable_status -eq 0 ]]; then cat immutable.json; else cat immutable.err; fi
            echo
            echo '```'
            echo
            echo "rule suites API status: $suites_status"
            echo '```text'
            if [[ $suites_status -eq 0 ]]; then
              jq -c '[.[] | select(.ref == "refs/tags/v1.0.1") | {id, actor_name, ref, result, evaluation_result, pushed_at}]' suites.json
            else
              cat suites.err
            fi
            echo
            echo '```'
          } > rules-comment.md

          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file rules-comment.md
