name: Rules Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect effective rules and deleted release history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          gh api "${api_headers[@]}" "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=branch,tag,push" > rulesets.json 2>rulesets.err
          rulesets_status=$?
          gh api "${api_headers[@]}" "repos/$GITHUB_REPOSITORY/events?per_page=100" > events.json 2>events.err
          events_status=$?

          {
            echo 'Rules / deleted release diagnostic for v1.0.1'
            echo
            echo "rulesets API status: $rulesets_status"
            echo '```json'
            if [[ $rulesets_status -eq 0 ]]; then cat rulesets.json; else cat rulesets.err; fi
            echo
            echo '```'
            echo
            echo "repository events API status: $events_status"
            echo '```json'
            if [[ $events_status -eq 0 ]]; then
              jq '[.[] | select(.type == "ReleaseEvent" and .payload.release.tag_name == "v1.0.1") | {created_at, actor: .actor.login, action: .payload.action, release: {id: .payload.release.id, tag_name: .payload.release.tag_name, immutable: .payload.release.immutable, draft: .payload.release.draft, prerelease: .payload.release.prerelease, target_commitish: .payload.release.target_commitish, published_at: .payload.release.published_at}}]' events.json
            else
              cat events.err
            fi
            echo
            echo '```'
          } > rules-comment.md

          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file rules-comment.md
