name: Help maintain and develop / 共同维护与开发
description: Discuss a module or development area you would like to help maintain. / 商量希望长期负责的模块或开发方向。
body:
  - type: markdown
    attributes:
      value: |
        欢迎一起维护和开发这个项目，长期负责某个模块或方向，主动跟进问题、开发改进，并参与测试和代码审查。可以用中文或英文交流；单次修复可直接提 PR。

        Help maintain and develop the project by taking ongoing responsibility for a module or area: follow up on issues, develop improvements, and help with tests and code reviews. English and Chinese are both welcome; one-off fixes can go straight to a pull request.

  - type: input
    id: area
    attributes:
      label: 希望负责的模块或方向 / Module or area
      description: 例如模型接入、搜索、生图、手机远程、Linux 兼容，或其他模块。 / For example models, search, images, phone remote control, Linux compatibility or another area.
    validations:
      required: true

  - type: textarea
    id: ideas
    attributes:
      label: 维护或开发思路 / Maintenance or development ideas
      description: 可选。希望如何维护这部分，有哪些改进或开发计划？暂无具体方案也可以先讨论。 / Optional. How would you maintain this area, and what would you improve or build? A detailed plan is not required.
